<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 334" role="img" lang="da" font-family="system-ui, sans-serif">
  <title>ESPHome, ESP32 og Home Assistant: sådan hænger de sammen</title>
  <desc>Du beskriver enheden i en YAML-fil i ESPHome. ESPHome flasher den til ESP32-boardet. ESP32 sender sine målinger, for eksempel 22,5 °C og 45 %, til Home Assistant over WiFi. Et board koster 40-50 kr, der skal kun skrives YAML, og det virker uden cloud.</desc>
