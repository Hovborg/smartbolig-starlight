<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 730" role="img" lang="da" font-family="system-ui, sans-serif">
  <title>ESP32-DevKit: hvilke ben kan bruges til hvad</title>
  <desc>Strøm: 3V3 giver 3,3 V, 5V/VIN giver 5 V fra USB, GND er minus. Frie GPIO: 4, 13, 14, 16, 17, 18, 19, 21, 22, 23, 25, 26, 27, 32 og 33. Kun input: 34, 35, 36 og 39; de kan ikke være udgang og har ingen pull-up. Læses ved opstart og bruges med omtanke: 0, 2, 5, 12 og 15. Optaget: 1 og 3 til USB-seriel og 6 til 11 til flash; på WROVER-moduler også 16 og 17. Benenes placering skifter fra board til board.</desc>
  <rect x="0" y="0" width="640" height="730" fill="#1a1a2e"/>
  <text x="320" y="46" font-size="24" fill="#e2e8f0" text-anchor="middle" font-weight="700">ESP32-DevKit: hvilke ben kan bruges?</text>
  <rect x="24" y="66" width="592" height="118" rx="10" fill="#1e293b" stroke="#ef4444" stroke-width="2"/>
  <text x="40" y="98" font-size="18" fill="#fca5a5" font-weight="700">Strøm</text>
  <rect x="40" y="112" width="72" height="36" rx="6" fill="#dc2626"/>
  <text x="76" y="136.3" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">3V3</text>
  <rect x="120" y="112" width="100" height="36" rx="6" fill="#dc2626"/>
  <text x="170" y="136.3" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">5V/VIN</text>
  <rect x="228" y="112" width="72" height="36" rx="6" fill="#111827" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="264" y="136.3" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">GND</text>
  <text x="40" y="170" font-size="18" fill="#e2e8f0">3V3 = 3,3 V · 5V/VIN = 5 V fra USB · GND = minus</text>
  <rect x="24" y="194" width="592" height="150" rx="10" fill="#1e293b" stroke="#22c55e" stroke-width="2"/>
  <text x="40" y="226" font-size="18" fill="#4ade80" font-weight="700">Frie GPIO: til sensorer, lys og relæer</text>
  <rect x="40" y="242" width="56" height="36" rx="6" fill="#22c55e"/>
  <text x="68" y="266.3" font-size="18" fill="#0b1220" text-anchor="middle" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">4</text>
  <rect x="104" y="242" width="56" height="36" rx="6" fill="#22c55e"/>
  <text x="132" y="266.3" font-size="18" fill="#0b1220" text-anchor="middle" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">13</text>
  <rect x="168" y="242" width="56" height="36" rx="6" fill="#22c55e"/>
  <text x="196" y="266.3" font-size="18" fill="#0b1220" text-anchor="middle" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">14</text>
  <rect x="232" y="242" width="56" height="36" rx="6" fill="#22c55e"/>
  <text x="260" y="266.3" font-size="18" fill="#0b1220" text-anchor="middle" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">16</text>
  <rect x="296" y="242" width="56" height="36" rx="6" fill="#22c55e"/>
  <text x="324" y="266.3" font-size="18" fill="#0b1220" text-anchor="middle" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">17</text>
  <rect x="360" y="242" width="56" height="36" rx="6" fill="#22c55e"/>
  <text x="388" y="266.3" font-size="18" fill="#0b1220" text-anchor="middle" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">18</text>
  <rect x="424" y="242" width="56" height="36" rx="6" fill="#22c55e"/>
  <text x="452" y="266.3" font-size="18" fill="#0b1220" text-anchor="middle" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">19</text>
  <rect x="488" y="242" width="56" height="36" rx="6" fill="#22c55e"/>
  <text x="516" y="266.3" font-size="18" fill="#0b1220" text-anchor="middle" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">21</text>
  <rect x="40" y="288" width="56" height="36" rx="6" fill="#22c55e"/>
  <text x="68" y="312.3" font-size="18" fill="#0b1220" text-anchor="middle" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">22</text>
  <rect x="104" y="288" width="56" height="36" rx="6" fill="#22c55e"/>
  <text x="132" y="312.3" font-size="18" fill="#0b1220" text-anchor="middle" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">23</text>
  <rect x="168" y="288" width="56" height="36" rx="6" fill="#22c55e"/>
  <text x="196" y="312.3" font-size="18" fill="#0b1220" text-anchor="middle" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">25</text>
  <rect x="232" y="288" width="56" height="36" rx="6" fill="#22c55e"/>
  <text x="260" y="312.3" font-size="18" fill="#0b1220" text-anchor="middle" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">26</text>
  <rect x="296" y="288" width="56" height="36" rx="6" fill="#22c55e"/>
  <text x="324" y="312.3" font-size="18" fill="#0b1220" text-anchor="middle" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">27</text>
  <rect x="360" y="288" width="56" height="36" rx="6" fill="#22c55e"/>
  <text x="388" y="312.3" font-size="18" fill="#0b1220" text-anchor="middle" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">32</text>
  <rect x="424" y="288" width="56" height="36" rx="6" fill="#22c55e"/>
  <text x="452" y="312.3" font-size="18" fill="#0b1220" text-anchor="middle" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">33</text>
  <rect x="24" y="354" width="286" height="170" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
  <text x="40" y="386" font-size="18" fill="#60a5fa" font-weight="700">Kun input</text>
  <rect x="40" y="402" width="56" height="36" rx="6" fill="#2563eb"/>
  <text x="68" y="426.3" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">34</text>
  <rect x="104" y="402" width="56" height="36" rx="6" fill="#2563eb"/>
  <text x="132" y="426.3" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">35</text>
  <rect x="168" y="402" width="56" height="36" rx="6" fill="#2563eb"/>
  <text x="196" y="426.3" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">36</text>
  <rect x="232" y="402" width="56" height="36" rx="6" fill="#2563eb"/>
  <text x="260" y="426.3" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">39</text>
  <text x="40" y="462" font-size="18" fill="#e2e8f0">kan ikke være udgang</text>
  <text x="40" y="486" font-size="18" fill="#e2e8f0">har ingen pull-up</text>
  <text x="40" y="510" font-size="18" fill="#e2e8f0">36/39 hedder ofte VP/VN</text>
  <rect x="330" y="354" width="286" height="170" rx="10" fill="#1e293b" stroke="#9ca3af" stroke-width="2"/>
  <text x="346" y="386" font-size="18" fill="#d1d5db" font-weight="700">Optaget: brug dem ikke</text>
  <rect x="346" y="402" width="44" height="36" rx="6" fill="#4b5563"/>
  <text x="368" y="426.3" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">1</text>
  <rect x="398" y="402" width="44" height="36" rx="6" fill="#4b5563"/>
  <text x="420" y="426.3" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">3</text>
  <text x="452" y="426.3" font-size="18" fill="#e2e8f0">USB-seriel</text>
  <rect x="346" y="444" width="96" height="36" rx="6" fill="#4b5563"/>
  <text x="394" y="468.3" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">6–11</text>
  <text x="452" y="468.3" font-size="18" fill="#e2e8f0">flash</text>
  <text x="346" y="506" font-size="18" fill="#e2e8f0">WROVER: også 16 og 17</text>
  <rect x="24" y="534" width="592" height="118" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
  <text x="40" y="566" font-size="18" fill="#fbbf24" font-weight="700">Læses ved opstart: brug med omtanke</text>
  <rect x="40" y="580" width="56" height="36" rx="6" fill="#f59e0b"/>
  <text x="68" y="604.3" font-size="18" fill="#0b1220" text-anchor="middle" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">0</text>
  <rect x="104" y="580" width="56" height="36" rx="6" fill="#f59e0b"/>
  <text x="132" y="604.3" font-size="18" fill="#0b1220" text-anchor="middle" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">2</text>
  <rect x="168" y="580" width="56" height="36" rx="6" fill="#f59e0b"/>
  <text x="196" y="604.3" font-size="18" fill="#0b1220" text-anchor="middle" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">5</text>
  <rect x="232" y="580" width="56" height="36" rx="6" fill="#f59e0b"/>
  <text x="260" y="604.3" font-size="18" fill="#0b1220" text-anchor="middle" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">12</text>
  <rect x="296" y="580" width="56" height="36" rx="6" fill="#f59e0b"/>
  <text x="324" y="604.3" font-size="18" fill="#0b1220" text-anchor="middle" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">15</text>
  <text x="40" y="638" font-size="18" fill="#e2e8f0">GPIO0 = BOOT-knappen · GPIO2 = lysdiode på mange boards</text>
  <text x="320" y="684" font-size="18" fill="#a3b1c6" text-anchor="middle">Benenes placering skifter fra board til board.</text>
  <text x="320" y="710" font-size="18" fill="#a3b1c6" text-anchor="middle">På mange boards står der D4 i stedet for GPIO4.</text>
</svg>
