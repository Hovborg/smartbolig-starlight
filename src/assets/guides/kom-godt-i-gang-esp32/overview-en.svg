<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 334" role="img" lang="en" font-family="system-ui, sans-serif">
  <title>ESPHome, ESP32 and Home Assistant: how they fit together</title>
  <desc>You describe the device in a YAML file in ESPHome. ESPHome flashes it to the ESP32 board. The ESP32 sends its readings, for example 22.5 °C and 45 %, to Home Assistant over WiFi. A board costs $5-10, you only write YAML, and it works without the cloud.</desc>
  <rect x="0" y="0" width="640" height="334" fill="#1a1a2e"/>
  <text x="320" y="46" font-size="26" fill="#e2e8f0" text-anchor="middle" font-weight="700">ESPHome, ESP32 and Home Assistant</text>
  <rect x="24" y="72" width="176" height="178" rx="10" fill="#1e293b" stroke="#06b6d4" stroke-width="2.5"/>
  <text x="112" y="106" font-size="20" fill="#67e8f9" text-anchor="middle" font-weight="700">ESPHome</text>
  <text x="112" y="132" font-size="18" fill="#e2e8f0" text-anchor="middle">your YAML file</text>
  <rect x="34" y="150" width="156" height="84" rx="6" fill="#0b1220" stroke="#334155" stroke-width="1.5"/>
  <text x="46" y="184" font-size="18" fill="#67e8f9" font-family="ui-monospace, Menlo, Consolas, monospace">esphome:</text>
  <text x="68" y="214" font-size="18" fill="#e2e8f0" font-family="ui-monospace, Menlo, Consolas, monospace">name: hall</text>
  <rect x="252" y="72" width="152" height="178" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="2.5"/>
  <text x="328" y="106" font-size="20" fill="#60a5fa" text-anchor="middle" font-weight="700">ESP32</text>
  <text x="328" y="132" font-size="18" fill="#e2e8f0" text-anchor="middle">with a sensor</text>
  <rect x="290" y="150" width="76" height="84" rx="5" fill="#1e3a5f" stroke="#60a5fa" stroke-width="1.5"/>
  <rect x="304" y="158" width="48" height="34" rx="3" fill="#94a3b8"/>
  <rect x="316" y="220" width="24" height="14" rx="2" fill="#cbd5e1"/>
  <circle cx="283" cy="160" r="3" fill="#fbbf24"/>
  <circle cx="373" cy="160" r="3" fill="#fbbf24"/>
  <circle cx="283" cy="173" r="3" fill="#fbbf24"/>
  <circle cx="373" cy="173" r="3" fill="#fbbf24"/>
  <circle cx="283" cy="186" r="3" fill="#fbbf24"/>
  <circle cx="373" cy="186" r="3" fill="#fbbf24"/>
  <circle cx="283" cy="199" r="3" fill="#fbbf24"/>
  <circle cx="373" cy="199" r="3" fill="#fbbf24"/>
  <circle cx="283" cy="212" r="3" fill="#fbbf24"/>
  <circle cx="373" cy="212" r="3" fill="#fbbf24"/>
  <circle cx="283" cy="225" r="3" fill="#fbbf24"/>
  <circle cx="373" cy="225" r="3" fill="#fbbf24"/>
  <rect x="456" y="72" width="160" height="178" rx="10" fill="#1e293b" stroke="#22c55e" stroke-width="2.5"/>
  <text x="536" y="102" font-size="20" fill="#4ade80" text-anchor="middle" font-weight="700">Home</text>
  <text x="536" y="126" font-size="20" fill="#4ade80" text-anchor="middle" font-weight="700">Assistant</text>
  <rect x="476" y="144" width="120" height="40" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="536" y="171" font-size="20" fill="#ffffff" text-anchor="middle" font-weight="700">22.5 °C</text>
  <rect x="476" y="192" width="120" height="40" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="536" y="219" font-size="20" fill="#ffffff" text-anchor="middle" font-weight="700">45 %</text>
  <path d="M203 176L238 176" fill="none" stroke="#06b6d4" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M249 176L238 169.9L238 182.1Z" fill="#06b6d4"/>
