  <path d="M407 176L442 176" fill="none" stroke="#22c55e" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M453 176L442 169.9L442 182.1Z" fill="#22c55e"/>
  <text x="430" y="164" font-size="18" fill="#4ade80" text-anchor="middle">WiFi</text>
  <rect x="24" y="272" width="176" height="40" rx="6" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5"/>
