<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 792" role="img" lang="en" font-family="system-ui, sans-serif">
  <title>ESPHome, ESP32 and Home Assistant: how they fit together</title>
  <desc>You describe the device in a YAML file in ESPHome. ESPHome flashes it to the ESP32 board. The ESP32 sends its readings, for example 22.5 °C and 45 %, to Home Assistant over WiFi. A board costs $5-10, you only write YAML, and it works without the cloud.</desc>
  <rect x="0" y="0" width="640" height="792" fill="#1a1a2e"/>
  <text x="320" y="44" font-size="28" fill="#e2e8f0" text-anchor="middle" font-weight="700">ESPHome, ESP32 and Home Assistant</text>
  <rect x="24" y="72" width="592" height="140" rx="10" fill="#1e293b" stroke="#06b6d4" stroke-width="2.5"/>
  <text x="44" y="128" font-size="24" fill="#67e8f9" font-weight="700">ESPHome</text>
  <text x="44" y="164" font-size="22" fill="#e2e8f0">your YAML file</text>
  <rect x="300" y="92" width="292" height="100" rx="6" fill="#0b1220" stroke="#334155" stroke-width="1.5"/>
  <text x="318" y="130" font-size="22" fill="#67e8f9" font-family="ui-monospace, Menlo, Consolas, monospace">esphome:</text>
  <text x="346" y="170" font-size="22" fill="#e2e8f0" font-family="ui-monospace, Menlo, Consolas, monospace">name: hall</text>
  <path d="M320 213L320 256" fill="none" stroke="#06b6d4" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M320 267L314 256L326 256Z" fill="#06b6d4"/>
  <text x="340" y="248" font-size="22" fill="#67e8f9">flash</text>
  <rect x="24" y="268" width="592" height="140" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="2.5"/>
  <text x="44" y="324" font-size="24" fill="#60a5fa" font-weight="700">ESP32</text>
  <text x="44" y="360" font-size="22" fill="#e2e8f0">with a sensor</text>
  <rect x="460" y="286" width="76" height="104" rx="5" fill="#1e3a5f" stroke="#60a5fa" stroke-width="1.5"/>
  <rect x="474" y="294" width="48" height="34" rx="3" fill="#94a3b8"/>
  <rect x="486" y="368" width="24" height="14" rx="2" fill="#cbd5e1"/>
  <circle cx="453" cy="300" r="3" fill="#fbbf24"/>
  <circle cx="543" cy="300" r="3" fill="#fbbf24"/>
  <circle cx="453" cy="315" r="3" fill="#fbbf24"/>
  <circle cx="543" cy="315" r="3" fill="#fbbf24"/>
  <circle cx="453" cy="330" r="3" fill="#fbbf24"/>
  <circle cx="543" cy="330" r="3" fill="#fbbf24"/>
  <circle cx="453" cy="345" r="3" fill="#fbbf24"/>
  <circle cx="543" cy="345" r="3" fill="#fbbf24"/>
  <circle cx="453" cy="360" r="3" fill="#fbbf24"/>
  <circle cx="543" cy="360" r="3" fill="#fbbf24"/>
  <circle cx="453" cy="375" r="3" fill="#fbbf24"/>
  <circle cx="543" cy="375" r="3" fill="#fbbf24"/>
  <path d="M320 409L320 452" fill="none" stroke="#22c55e" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M320 463L314 452L326 452Z" fill="#22c55e"/>
  <text x="340" y="444" font-size="22" fill="#4ade80">WiFi</text>
  <rect x="24" y="464" width="592" height="130" rx="10" fill="#1e293b" stroke="#22c55e" stroke-width="2.5"/>
  <text x="44" y="537" font-size="24" fill="#4ade80" font-weight="700">Home Assistant</text>
  <rect x="360" y="478" width="224" height="46" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="472" y="508.9" font-size="22" fill="#ffffff" text-anchor="middle" font-weight="700">22.5 °C</text>
  <rect x="360" y="534" width="224" height="46" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="472" y="564.9" font-size="22" fill="#ffffff" text-anchor="middle" font-weight="700">45 %</text>
  <rect x="24" y="616" width="592" height="44" rx="6" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="320" y="645.9" font-size="22" fill="#e2e8f0" text-anchor="middle">$5-10 per board</text>
  <rect x="24" y="670" width="592" height="44" rx="6" fill="#0f172a" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="320" y="699.9" font-size="22" fill="#e2e8f0" text-anchor="middle">only YAML, no code</text>
  <rect x="24" y="724" width="592" height="44" rx="6" fill="#0f172a" stroke="#22c55e" stroke-width="1.5"/>
  <text x="320" y="753.9" font-size="22" fill="#e2e8f0" text-anchor="middle">no cloud needed</text>
</svg>
