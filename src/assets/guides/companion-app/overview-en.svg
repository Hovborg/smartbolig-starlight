<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 700" role="img" lang="en" font-family="system-ui, sans-serif">
  <title>How the Companion app talks to Home Assistant</title>
  <desc>The phone with the Companion app talks to the home server on two addresses. At home it uses the local address, and away it uses the external address. Sensors and location go up to the server. Notifications and the dashboard come down to the phone. The app picks the address from the Wi-Fi network.</desc>
  <rect x="0" y="0" width="640" height="700" fill="#1a1a2e"/>
  <text x="320" y="44" font-size="28" fill="#e2e8f0" text-anchor="middle" font-weight="700">The app and Home Assistant</text>
  <path d="M152 194L152 162" fill="none" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
  <path d="M152 150L146 162L158 162Z" fill="#fbbf24"/>
  <path d="M180 150L180 182" fill="none" stroke="#4ade80" stroke-width="3" stroke-linecap="round"/>
  <path d="M180 194L174 182L186 182Z" fill="#4ade80"/>
  <path d="M152 350L152 318" fill="none" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
  <path d="M152 306L146 318L158 318Z" fill="#fbbf24"/>
  <path d="M180 306L180 338" fill="none" stroke="#4ade80" stroke-width="3" stroke-linecap="round"/>
  <path d="M180 350L174 338L186 338Z" fill="#4ade80"/>
  <path d="M460 194L460 162" fill="none" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
  <path d="M460 150L454 162L466 162Z" fill="#fbbf24"/>
  <path d="M488 150L488 182" fill="none" stroke="#4ade80" stroke-width="3" stroke-linecap="round"/>
  <path d="M488 194L482 182L494 182Z" fill="#4ade80"/>
  <path d="M460 350L460 318" fill="none" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
  <path d="M460 306L454 318L466 318Z" fill="#fbbf24"/>
  <path d="M488 306L488 338" fill="none" stroke="#4ade80" stroke-width="3" stroke-linecap="round"/>
  <path d="M488 350L482 338L494 338Z" fill="#4ade80"/>
  <rect x="24" y="72" width="592" height="76" rx="10" fill="#15803d" stroke="#4ade80" stroke-width="2"/>
  <text x="320" y="106" font-size="24" fill="#ffffff" text-anchor="middle" font-weight="700">Home Assistant</text>
  <text x="320" y="136" font-size="22" fill="#ffffff" text-anchor="middle">the home server</text>
  <rect x="24" y="196" width="284" height="108" rx="10" fill="#1e293b" stroke="#94a3b8" stroke-width="2"/>
  <rect x="332" y="196" width="284" height="108" rx="10" fill="#1e293b" stroke="#94a3b8" stroke-width="2"/>
  <text x="166" y="246" font-size="24" fill="#ffffff" text-anchor="middle" font-weight="700">At home</text>
  <text x="166" y="282" font-size="22" fill="#e2e8f0" text-anchor="middle">local address</text>
  <text x="474" y="246" font-size="24" fill="#ffffff" text-anchor="middle" font-weight="700">Away</text>
  <text x="474" y="282" font-size="22" fill="#e2e8f0" text-anchor="middle">external address</text>
  <rect x="24" y="352" width="592" height="76" rx="10" fill="#2563eb" stroke="#60a5fa" stroke-width="2"/>
  <text x="320" y="386" font-size="24" fill="#ffffff" text-anchor="middle" font-weight="700">Phone</text>
  <text x="320" y="416" font-size="22" fill="#ffffff" text-anchor="middle">Companion app</text>
  <rect x="24" y="460" width="592" height="216" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <path d="M52 520L52 502" fill="none" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
  <path d="M52 490L46 502L58 502Z" fill="#fbbf24"/>
  <text x="76" y="513" font-size="22" fill="#e2e8f0">Up: sensors and location</text>
  <path d="M52 544L52 562" fill="none" stroke="#4ade80" stroke-width="3" stroke-linecap="round"/>
  <path d="M52 574L46 562L58 562Z" fill="#4ade80"/>
  <text x="76" y="567" font-size="22" fill="#e2e8f0">Down: notifications and dashboard</text>
  <text x="320" y="626" font-size="22" fill="#a3b1c6" text-anchor="middle">The app picks the address from</text>
  <text x="320" y="656" font-size="22" fill="#a3b1c6" text-anchor="middle">the Wi-Fi network you are on.</text>
</svg>
