<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 790" role="img" lang="da" font-family="system-ui, sans-serif">
  <title>Sådan taler Companion-appen med Home Assistant</title>
  <desc>Telefonen med Companion-appen taler med hjemmeserveren på to adresser. Hjemme bruges den lokale adresse, og ude bruges den eksterne adresse. Op til serveren går sensorer og placering, og dashboardet kommer ned til telefonen. Notifikationer sendes som udgangspunkt gennem Apples eller Googles push-tjeneste. Appen vælger adresse ud fra wifi-netværket.</desc>
  <rect x="0" y="0" width="640" height="790" fill="#1a1a2e"/>
  <text x="320" y="44" font-size="28" fill="#e2e8f0" text-anchor="middle" font-weight="700">Appen og Home Assistant</text>
  <path d="M152 194L152 162" fill="none" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
  <path d="M152 150L146 162L158 162Z" fill="#fbbf24"/>
