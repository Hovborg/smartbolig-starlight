<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 636" role="img" lang="da" font-family="system-ui, sans-serif">
  <title>Home Assistant OS som virtuel maskine på Proxmox VE</title>
  <desc>Home Assistant OS kører i en virtuel maskine (fx VM 100 med 4 kerner, 4 GB RAM og 32 GB disk) på Proxmox VE. VM'en får en Zigbee-dongle via USB-passthrough, disk på local-lvm og netværk gennem broen vmbr0. Proxmox VE kører på serverens hardware og har sin webside på port 8006.</desc>
  <defs><linearGradient id="pve" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c2410c"/><stop offset="1" stop-color="#9a3412"/></linearGradient></defs>
  <rect x="0" y="0" width="640" height="636" fill="#1a1a2e"/>
  <text x="320" y="46" font-size="26" fill="#e2e8f0" text-anchor="middle" font-weight="700">Home Assistant OS på Proxmox</text>
  <rect x="24" y="70" width="592" height="238" rx="14" fill="#1e293b" stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="9 7"/>
  <text x="44" y="101" font-size="18" fill="#a3b1c6">Virtuel maskine (fx VM 100)</text>
  <rect x="40" y="114" width="560" height="180" rx="10" fill="#0e7490" stroke="#67e8f9" stroke-width="2"/>
  <text x="320" y="148" font-size="22" fill="#ffffff" text-anchor="middle" font-weight="700">Home Assistant OS</text>
  <rect x="52" y="162" width="172" height="66" rx="8" fill="#155e75"/>
  <text x="138" y="189" font-size="18" fill="#67e8f9" text-anchor="middle" font-weight="700">Supervisor</text>
  <text x="138" y="215" font-size="18" fill="#ffffff" text-anchor="middle">apps</text>
  <rect x="234" y="162" width="172" height="66" rx="8" fill="#155e75"/>
  <text x="320" y="189" font-size="18" fill="#67e8f9" text-anchor="middle" font-weight="700">Core</text>
  <text x="320" y="215" font-size="18" fill="#ffffff" text-anchor="middle">automationer</text>
  <rect x="416" y="162" width="172" height="66" rx="8" fill="#155e75"/>
  <text x="502" y="189" font-size="18" fill="#67e8f9" text-anchor="middle" font-weight="700">Frontend</text>
  <text x="502" y="215" font-size="18" fill="#ffffff" text-anchor="middle">dashboard</text>
  <text x="320" y="268" font-size="18" fill="#ffffff" text-anchor="middle">4 kerner · 4 GB RAM · 32 GB disk</text>
  <path d="M116 308L116 330" fill="none" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 5"/>
  <rect x="24" y="330" width="184" height="74" rx="10" fill="#0f172a" stroke="#f59e0b" stroke-width="2"/>
  <text x="116" y="360" font-size="18" fill="#fbbf24" text-anchor="middle" font-weight="700">USB-passthrough</text>
  <text x="116" y="387" font-size="18" fill="#e2e8f0" text-anchor="middle">Zigbee-dongle</text>
  <path d="M320 308L320 330" fill="none" stroke="#8b5cf6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 5"/>
  <rect x="228" y="330" width="184" height="74" rx="10" fill="#0f172a" stroke="#8b5cf6" stroke-width="2"/>
  <text x="320" y="360" font-size="18" fill="#c4b5fd" text-anchor="middle" font-weight="700">Disk</text>
  <text x="320" y="387" font-size="18" fill="#e2e8f0" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">local-lvm</text>
  <path d="M524 308L524 330" fill="none" stroke="#06b6d4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 5"/>
  <rect x="432" y="330" width="184" height="74" rx="10" fill="#0f172a" stroke="#06b6d4" stroke-width="2"/>
  <text x="524" y="360" font-size="18" fill="#67e8f9" text-anchor="middle" font-weight="700">Netværk</text>
  <text x="524" y="387" font-size="18" fill="#e2e8f0" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">vmbr0 (bridge)</text>
  <rect x="24" y="424" width="592" height="82" rx="10" fill="url(#pve)" stroke="#fb923c" stroke-width="2"/>
  <text x="320" y="458" font-size="22" fill="#ffffff" text-anchor="middle" font-weight="700">Proxmox VE</text>
  <text x="320" y="487" font-size="18" fill="#ffffff" text-anchor="middle">hypervisor · webside på port 8006</text>
  <rect x="24" y="526" width="592" height="92" rx="10" fill="#1f2937" stroke="#6b7280" stroke-width="2"/>
  <text x="44" y="556" font-size="18" fill="#a3b1c6">Serverens hardware</text>
  <rect x="85" y="571" width="76" height="34" rx="6" fill="#0f172a" stroke="#9ca3af" stroke-width="1.5"/>
