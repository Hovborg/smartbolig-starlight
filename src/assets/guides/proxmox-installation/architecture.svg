  <rect x="175" y="571" width="76" height="34" rx="6" fill="#0f172a" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="213" y="594.3" font-size="18" fill="#e2e8f0" text-anchor="middle">RAM</text>
  <rect x="265" y="571" width="76" height="34" rx="6" fill="#0f172a" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="303" y="594.3" font-size="18" fill="#e2e8f0" text-anchor="middle">SSD</text>
  <rect x="355" y="571" width="76" height="34" rx="6" fill="#0f172a" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="393" y="594.3" font-size="18" fill="#e2e8f0" text-anchor="middle">USB</text>
  <rect x="445" y="571" width="110" height="34" rx="6" fill="#0f172a" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="500" y="594.3" font-size="18" fill="#e2e8f0" text-anchor="middle">Netkort</text>
</svg>
