<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 794" role="img" lang="da" font-family="system-ui, sans-serif">
  <title>Home Assistant OS som virtuel maskine på Proxmox VE</title>
  <desc>Home Assistant OS kører i en virtuel maskine (fx VM 100 med 4 kerner, 4 GB RAM og 32 GB disk) på Proxmox VE. VM'en får en Zigbee-dongle via USB-passthrough, disk på local-lvm og netværk gennem broen vmbr0. Proxmox VE kører på serverens hardware og har sin webside på port 8006.</desc>
  <defs><linearGradient id="pve" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c2410c"/><stop offset="1" stop-color="#9a3412"/></linearGradient></defs>
  <rect x="0" y="0" width="640" height="794" fill="#1a1a2e"/>
  <text x="320" y="44" font-size="28" fill="#e2e8f0" text-anchor="middle" font-weight="700">Home Assistant OS på Proxmox</text>
  <rect x="24" y="72" width="592" height="252" rx="14" fill="#1e293b" stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="9 7"/>
  <text x="44" y="106" font-size="22" fill="#a3b1c6">Virtuel maskine (fx VM 100)</text>
  <rect x="40" y="122" width="560" height="186" rx="10" fill="#0e7490" stroke="#67e8f9" stroke-width="2"/>
  <text x="320" y="158" font-size="24" fill="#ffffff" text-anchor="middle" font-weight="700">Home Assistant OS</text>
  <rect x="48" y="176" width="176" height="76" rx="8" fill="#155e75"/>
  <text x="136" y="208" font-size="22" fill="#67e8f9" text-anchor="middle" font-weight="700">Supervisor</text>
  <text x="136" y="238" font-size="22" fill="#ffffff" text-anchor="middle">apps</text>
  <rect x="232" y="176" width="176" height="76" rx="8" fill="#155e75"/>
  <text x="320" y="208" font-size="22" fill="#67e8f9" text-anchor="middle" font-weight="700">Core</text>
  <text x="320" y="238" font-size="22" fill="#ffffff" text-anchor="middle">automationer</text>
  <rect x="416" y="176" width="176" height="76" rx="8" fill="#155e75"/>
  <text x="504" y="208" font-size="22" fill="#67e8f9" text-anchor="middle" font-weight="700">Frontend</text>
  <text x="504" y="238" font-size="22" fill="#ffffff" text-anchor="middle">dashboard</text>
  <text x="320" y="288" font-size="22" fill="#ffffff" text-anchor="middle">4 kerner · 4 GB RAM · 32 GB disk</text>
  <rect x="56" y="348" width="560" height="52" rx="10" fill="#0f172a" stroke="#f59e0b" stroke-width="2"/>
  <text x="74" y="381.9" font-size="22" fill="#fbbf24" font-weight="700">USB-passthrough</text>
  <text x="598" y="381.9" font-size="22" fill="#e2e8f0" text-anchor="end">Zigbee-dongle</text>
  <rect x="56" y="412" width="560" height="52" rx="10" fill="#0f172a" stroke="#8b5cf6" stroke-width="2"/>
  <text x="74" y="445.9" font-size="22" fill="#c4b5fd" font-weight="700">Disk</text>
  <text x="598" y="445.9" font-size="22" fill="#e2e8f0" text-anchor="end" font-family="ui-monospace, Menlo, Consolas, monospace">local-lvm</text>
  <rect x="56" y="476" width="560" height="52" rx="10" fill="#0f172a" stroke="#06b6d4" stroke-width="2"/>
  <text x="74" y="509.9" font-size="22" fill="#67e8f9" font-weight="700">Netværk</text>
  <text x="598" y="509.9" font-size="22" fill="#e2e8f0" text-anchor="end" font-family="ui-monospace, Menlo, Consolas, monospace">vmbr0 (bridge)</text>
  <path d="M40 324V502" fill="none" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 5"/>
  <path d="M40 374L56 374" fill="none" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M40 438L56 438" fill="none" stroke="#8b5cf6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M40 502L56 502" fill="none" stroke="#06b6d4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="24" y="546" width="592" height="96" rx="10" fill="url(#pve)" stroke="#fb923c" stroke-width="2"/>
  <text x="320" y="584" font-size="26" fill="#ffffff" text-anchor="middle" font-weight="700">Proxmox VE</text>
  <text x="320" y="620" font-size="22" fill="#ffffff" text-anchor="middle">hypervisor · webside på port 8006</text>
  <rect x="24" y="660" width="592" height="110" rx="10" fill="#1f2937" stroke="#6b7280" stroke-width="2"/>
  <text x="44" y="696" font-size="22" fill="#a3b1c6">Serverens hardware</text>
  <rect x="44" y="710" width="72" height="44" rx="6" fill="#0f172a" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="80" y="739.9" font-size="22" fill="#e2e8f0" text-anchor="middle">CPU</text>
  <rect x="126" y="710" width="72" height="44" rx="6" fill="#0f172a" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="162" y="739.9" font-size="22" fill="#e2e8f0" text-anchor="middle">RAM</text>
  <rect x="208" y="710" width="72" height="44" rx="6" fill="#0f172a" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="244" y="739.9" font-size="22" fill="#e2e8f0" text-anchor="middle">SSD</text>
  <rect x="290" y="710" width="72" height="44" rx="6" fill="#0f172a" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="326" y="739.9" font-size="22" fill="#e2e8f0" text-anchor="middle">USB</text>
  <rect x="372" y="710" width="120" height="44" rx="6" fill="#0f172a" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="432" y="739.9" font-size="22" fill="#e2e8f0" text-anchor="middle">Netkort</text>
</svg>
