  <path d="M336 504L358 504" fill="none" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 7"/>
  <text x="368" y="510.3" font-size="18" fill="#e2e8f0">alternativ vej</text>
</svg>
