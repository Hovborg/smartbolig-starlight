  <text x="320" y="259.9" font-size="22" fill="#ffffff" text-anchor="middle">Stikkontakt</text>
  <rect x="432" y="222" width="184" height="60" rx="10" fill="#2563eb" stroke="#60a5fa" stroke-width="2"/>
  <text x="524" y="259.9" font-size="22" fill="#ffffff" text-anchor="middle">Pære</text>
  <rect x="24" y="372" width="143" height="60" rx="10" fill="#7c3aed" stroke="#c4b5fd" stroke-width="2"/>
  <text x="95.5" y="409.9" font-size="22" fill="#ffffff" text-anchor="middle">Dørsensor</text>
