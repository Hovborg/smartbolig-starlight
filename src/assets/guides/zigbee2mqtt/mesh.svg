  <text x="320" y="472" font-size="22" fill="#a3b1c6" text-anchor="middle">Routere sender signalet videre,</text>
  <text x="320" y="502" font-size="22" fill="#a3b1c6" text-anchor="middle">så nettet når længere.</text>
