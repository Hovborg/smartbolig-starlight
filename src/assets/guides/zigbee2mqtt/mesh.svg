  <rect x="200" y="72" width="240" height="84" rx="10" fill="#15803d" stroke="#4ade80" stroke-width="2"/>
  <text x="320" y="108" font-size="24" fill="#ffffff" text-anchor="middle" font-weight="700">Koordinator</text>
  <text x="320" y="140" font-size="22" fill="#ffffff" text-anchor="middle">USB-dongle</text>
