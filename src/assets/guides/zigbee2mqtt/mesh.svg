<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 752" role="img" lang="da" font-family="system-ui, sans-serif">
  <title>Zigbee mesh-netværk med koordinator, routere og end devices</title>
  <desc>Koordinatoren er USB-donglen. Routere er enheder på strøm, for eksempel pærer og stikkontakter; de sender signalet videre. End devices er batterienheder som dørsensor, bevægelsessensor, temperatursensor og knap; de forbinder sig til en router eller til koordinatoren og kan skifte til en anden vej.</desc>
  <rect x="0" y="0" width="640" height="752" fill="#1a1a2e"/>
  <text x="320" y="44" font-size="28" fill="#e2e8f0" text-anchor="middle" font-weight="700">Zigbee mesh-netværk</text>
