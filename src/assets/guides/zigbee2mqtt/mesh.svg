<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 548" role="img" lang="da" font-family="system-ui, sans-serif">
  <title>Zigbee mesh-netværk med koordinator, routere og end devices</title>
  <desc>Koordinatoren er USB-donglen. Routere er enheder på strøm, for eksempel pærer og stikkontakter; de sender signalet videre. End devices er batterienheder som dørsensor, bevægelsessensor, temperatursensor og knap; de forbinder sig til en router eller til koordinatoren og kan skifte til en anden vej.</desc>
  <rect x="0" y="0" width="640" height="548" fill="#1a1a2e"/>
  <text x="320" y="46" font-size="26" fill="#e2e8f0" text-anchor="middle" font-weight="700">Zigbee mesh-netværk</text>
  <path d="M270 138L120 208" fill="none" stroke="#9ca3af" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M320 138L320 208" fill="none" stroke="#9ca3af" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M370 138L520 208" fill="none" stroke="#9ca3af" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M205 234L235 234" fill="none" stroke="#9ca3af" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M405 234L435 234" fill="none" stroke="#9ca3af" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M120 260L92 338" fill="none" stroke="#9ca3af" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M120 260L244 338" fill="none" stroke="#9ca3af" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M320 260L396 338" fill="none" stroke="#9ca3af" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M520 260L548 338" fill="none" stroke="#9ca3af" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M300 260L264 338" fill="none" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 7"/>
  <rect x="200" y="72" width="240" height="66" rx="10" fill="#15803d" stroke="#4ade80" stroke-width="2"/>
  <text x="320" y="100" font-size="20" fill="#ffffff" text-anchor="middle" font-weight="700">Koordinator</text>
  <text x="320" y="125" font-size="18" fill="#ffffff" text-anchor="middle">USB-dongle</text>
  <rect x="35" y="208" width="170" height="52" rx="10" fill="#2563eb" stroke="#60a5fa" stroke-width="2"/>
  <text x="120" y="240.3" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="700">Pære</text>
  <rect x="235" y="208" width="170" height="52" rx="10" fill="#2563eb" stroke="#60a5fa" stroke-width="2"/>
  <text x="320" y="240.3" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="700">Stikkontakt</text>
  <rect x="435" y="208" width="170" height="52" rx="10" fill="#2563eb" stroke="#60a5fa" stroke-width="2"/>
  <text x="520" y="240.3" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="700">Pære</text>
  <rect x="24" y="338" width="136" height="52" rx="10" fill="#7c3aed" stroke="#c4b5fd" stroke-width="2"/>
  <text x="92" y="370.3" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="700">Dørsensor</text>
  <rect x="176" y="338" width="136" height="52" rx="10" fill="#7c3aed" stroke="#c4b5fd" stroke-width="2"/>
  <text x="244" y="370.3" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="700">Bevægelse</text>
  <rect x="328" y="338" width="136" height="52" rx="10" fill="#7c3aed" stroke="#c4b5fd" stroke-width="2"/>
  <text x="396" y="370.3" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="700">Temperatur</text>
  <rect x="480" y="338" width="136" height="52" rx="10" fill="#7c3aed" stroke="#c4b5fd" stroke-width="2"/>
  <text x="548" y="370.3" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="700">Knap</text>
  <text x="320" y="424" font-size="18" fill="#a3b1c6" text-anchor="middle">Routere sender signalet videre, så nettet når længere.</text>
  <rect x="24" y="442" width="592" height="88" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <rect x="56" y="459" width="22" height="22" rx="4" fill="#15803d" stroke="#4ade80" stroke-width="1.5"/>
