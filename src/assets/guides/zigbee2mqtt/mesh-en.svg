<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 752" role="img" lang="en" font-family="system-ui, sans-serif">
  <title>Zigbee mesh network with a coordinator, routers and end devices</title>
  <desc>The coordinator is the USB dongle. Routers are mains-powered devices such as bulbs and smart plugs; they pass the signal on. End devices are battery devices such as a door sensor, a motion sensor, a temperature sensor and a button; they connect to a router or the coordinator and can switch to another route.</desc>
  <rect x="0" y="0" width="640" height="752" fill="#1a1a2e"/>
  <text x="320" y="44" font-size="28" fill="#e2e8f0" text-anchor="middle" font-weight="700">Zigbee mesh network</text>
  <path d="M270 156L116 222" fill="none" stroke="#9ca3af" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M320 156L320 222" fill="none" stroke="#9ca3af" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M370 156L524 222" fill="none" stroke="#9ca3af" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M208 252L228 252" fill="none" stroke="#9ca3af" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M412 252L432 252" fill="none" stroke="#9ca3af" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M106 282L109.5 372" fill="none" stroke="#9ca3af" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M126 282L261.33333333333337 372" fill="none" stroke="#9ca3af" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M320 282L413.1666666666667 372" fill="none" stroke="#9ca3af" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M524 282L565 372" fill="none" stroke="#9ca3af" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M300 282L275.33333333333337 372" fill="none" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 7"/>
  <rect x="200" y="72" width="240" height="84" rx="10" fill="#15803d" stroke="#4ade80" stroke-width="2"/>
  <text x="320" y="108" font-size="24" fill="#ffffff" text-anchor="middle" font-weight="700">Coordinator</text>
  <text x="320" y="140" font-size="22" fill="#ffffff" text-anchor="middle">USB dongle</text>
  <rect x="24" y="222" width="184" height="60" rx="10" fill="#2563eb" stroke="#60a5fa" stroke-width="2"/>
  <text x="116" y="259.9" font-size="22" fill="#ffffff" text-anchor="middle">Bulb</text>
  <rect x="228" y="222" width="184" height="60" rx="10" fill="#2563eb" stroke="#60a5fa" stroke-width="2"/>
  <text x="320" y="259.9" font-size="22" fill="#ffffff" text-anchor="middle">Smart plug</text>
  <rect x="432" y="222" width="184" height="60" rx="10" fill="#2563eb" stroke="#60a5fa" stroke-width="2"/>
  <text x="524" y="259.9" font-size="22" fill="#ffffff" text-anchor="middle">Bulb</text>
  <rect x="24" y="372" width="171" height="60" rx="10" fill="#7c3aed" stroke="#c4b5fd" stroke-width="2"/>
  <text x="109.5" y="409.9" font-size="22" fill="#ffffff" text-anchor="middle">Door sensor</text>
  <rect x="210.3" y="372" width="102" height="60" rx="10" fill="#7c3aed" stroke="#c4b5fd" stroke-width="2"/>
  <text x="261.3" y="409.9" font-size="22" fill="#ffffff" text-anchor="middle">Motion</text>
  <rect x="327.7" y="372" width="171" height="60" rx="10" fill="#7c3aed" stroke="#c4b5fd" stroke-width="2"/>
  <text x="413.2" y="409.9" font-size="22" fill="#ffffff" text-anchor="middle">Temperature</text>
  <rect x="514" y="372" width="102" height="60" rx="10" fill="#7c3aed" stroke="#c4b5fd" stroke-width="2"/>
  <text x="565" y="409.9" font-size="22" fill="#ffffff" text-anchor="middle">Button</text>
  <text x="320" y="472" font-size="22" fill="#a3b1c6" text-anchor="middle">Routers pass the signal on,</text>
  <text x="320" y="502" font-size="22" fill="#a3b1c6" text-anchor="middle">so the mesh reaches further.</text>
  <rect x="24" y="528" width="592" height="200" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <rect x="44" y="550" width="24" height="24" rx="4" fill="#15803d" stroke="#4ade80" stroke-width="1.5"/>
  <text x="84" y="570" font-size="22" fill="#e2e8f0">Coordinator</text>
  <rect x="44" y="594" width="24" height="24" rx="4" fill="#2563eb" stroke="#60a5fa" stroke-width="1.5"/>
