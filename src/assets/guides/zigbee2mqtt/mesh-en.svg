  <path d="M42 694L70 694" fill="none" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 7"/>
  <text x="84" y="702" font-size="22" fill="#e2e8f0">alternative route</text>
</svg>
