<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 802" role="img" lang="en" font-family="system-ui, sans-serif">
  <title>What plugs into a Raspberry Pi running Home Assistant OS</title>
  <desc>The router goes in the Ethernet port and the official power supply in the USB-C port. An SSD goes in a blue USB 3.0 port, and a Zigbee dongle in a USB 2.0 port with an extension cable. Home Assistant OS is on the SD card or the SSD. Afterwards http://homeassistant.local:8123 is opened in a browser.</desc>
  <defs><linearGradient id="pi" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#16a34a"/><stop offset="1" stop-color="#166534"/></linearGradient></defs>
  <rect x="0" y="0" width="640" height="802" fill="#1a1a2e"/>
  <text x="320" y="44" font-size="28" fill="#e2e8f0" text-anchor="middle" font-weight="700">Raspberry Pi: what plugs in where</text>
  <rect x="24" y="72" width="280" height="90" rx="10" fill="#0f172a" stroke="#3b82f6" stroke-width="2.5"/>
  <text x="164" y="110" font-size="24" fill="#60a5fa" text-anchor="middle" font-weight="700">Router</text>
  <text x="164" y="142" font-size="22" fill="#e2e8f0" text-anchor="middle">network cable</text>
  <rect x="336" y="72" width="280" height="90" rx="10" fill="#0f172a" stroke="#ef4444" stroke-width="2.5"/>
  <text x="476" y="110" font-size="24" fill="#fca5a5" text-anchor="middle" font-weight="700">Power supply</text>
  <text x="476" y="142" font-size="22" fill="#e2e8f0" text-anchor="middle">official, USB-C</text>
  <rect x="24" y="222" width="592" height="272" rx="14" fill="url(#pi)" stroke="#4ade80" stroke-width="2.5"/>
  <rect x="94" y="236" width="140" height="44" rx="6" fill="#111827" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="164" y="265.9" font-size="22" fill="#ffffff" text-anchor="middle" font-weight="700">Ethernet</text>
  <rect x="416" y="236" width="120" height="44" rx="6" fill="#111827" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="476" y="265.9" font-size="22" fill="#ffffff" text-anchor="middle" font-weight="700">USB-C</text>
  <text x="320" y="324" font-size="26" fill="#ffffff" text-anchor="middle" font-weight="700">Raspberry Pi 4 or 5</text>
  <rect x="140" y="342" width="360" height="48" rx="8" fill="#0e7490" stroke="#67e8f9" stroke-width="1.5"/>
  <text x="320" y="373.9" font-size="22" fill="#ffffff" text-anchor="middle" font-weight="700">Home Assistant OS</text>
  <text x="320" y="422" font-size="22" fill="#ffffff" text-anchor="middle">on an SD card or an SSD</text>
  <rect x="94" y="438" width="140" height="44" rx="6" fill="#111827" stroke="#4ade80" stroke-width="1.5"/>
  <text x="164" y="467.9" font-size="22" fill="#ffffff" text-anchor="middle" font-weight="700">USB 3.0</text>
  <rect x="406" y="438" width="140" height="44" rx="6" fill="#111827" stroke="#c4b5fd" stroke-width="1.5"/>
  <text x="476" y="467.9" font-size="22" fill="#ffffff" text-anchor="middle" font-weight="700">USB 2.0</text>
  <path d="M164 162L164 236" fill="none" stroke="#3b82f6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="164" cy="162" r="5" fill="#3b82f6"/>
  <circle cx="164" cy="236" r="5" fill="#3b82f6"/>
  <path d="M476 162L476 236" fill="none" stroke="#ef4444" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="476" cy="162" r="5" fill="#ef4444"/>
  <circle cx="476" cy="236" r="5" fill="#ef4444"/>
  <path d="M164 482L164 534" fill="none" stroke="#22c55e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 6"/>
  <circle cx="164" cy="482" r="5" fill="#22c55e"/>
  <circle cx="164" cy="534" r="5" fill="#22c55e"/>
  <path d="M476 482L476 534" fill="none" stroke="#8b5cf6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="476" cy="482" r="5" fill="#8b5cf6"/>
  <circle cx="476" cy="534" r="5" fill="#8b5cf6"/>
  <rect x="24" y="534" width="280" height="120" rx="10" fill="#0f172a" stroke="#22c55e" stroke-width="2.5" stroke-dasharray="9 7"/>
  <text x="164" y="570" font-size="24" fill="#4ade80" text-anchor="middle" font-weight="700">SSD (optional)</text>
  <text x="164" y="604" font-size="22" fill="#e2e8f0" text-anchor="middle">in a blue</text>
  <text x="164" y="634" font-size="22" fill="#e2e8f0" text-anchor="middle">USB 3.0 port</text>
  <rect x="336" y="534" width="280" height="120" rx="10" fill="#0f172a" stroke="#8b5cf6" stroke-width="2.5"/>
  <text x="476" y="570" font-size="24" fill="#c4b5fd" text-anchor="middle" font-weight="700">Zigbee dongle</text>
  <text x="476" y="604" font-size="22" fill="#e2e8f0" text-anchor="middle">USB 2.0 +</text>
  <text x="476" y="634" font-size="22" fill="#e2e8f0" text-anchor="middle">extension cable</text>
  <rect x="24" y="678" width="592" height="100" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="320" y="714" font-size="22" fill="#e2e8f0" text-anchor="middle">Open in your browser:</text>
  <text x="320" y="754" font-size="22" fill="#67e8f9" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">http://homeassistant.local:8123</text>
</svg>
