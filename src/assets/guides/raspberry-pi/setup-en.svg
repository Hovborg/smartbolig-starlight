<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 598" role="img" lang="en" font-family="system-ui, sans-serif">
  <title>What plugs into a Raspberry Pi running Home Assistant OS</title>
  <desc>The router goes in the Ethernet port and the official power supply in the USB-C port. An SSD goes in a blue USB 3.0 port, and a Zigbee dongle in a USB 2.0 port with an extension cable. Home Assistant OS is on the SD card or the SSD. Afterwards http://homeassistant.local:8123 is opened in a browser.</desc>
  <defs><linearGradient id="pi" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#16a34a"/><stop offset="1" stop-color="#166534"/></linearGradient></defs>
  <rect x="0" y="0" width="640" height="598" fill="#1a1a2e"/>
  <text x="320" y="46" font-size="26" fill="#e2e8f0" text-anchor="middle" font-weight="700">Raspberry Pi: what plugs in where</text>
  <rect x="24" y="70" width="276" height="74" rx="10" fill="#0f172a" stroke="#3b82f6" stroke-width="2.5"/>
  <text x="162" y="101" font-size="20" fill="#60a5fa" text-anchor="middle" font-weight="700">Router</text>
  <text x="162" y="128" font-size="18" fill="#e2e8f0" text-anchor="middle">network cable</text>
  <rect x="340" y="70" width="276" height="74" rx="10" fill="#0f172a" stroke="#ef4444" stroke-width="2.5"/>
  <text x="478" y="101" font-size="20" fill="#fca5a5" text-anchor="middle" font-weight="700">Power supply</text>
  <text x="478" y="128" font-size="18" fill="#e2e8f0" text-anchor="middle">official, USB-C</text>
  <rect x="24" y="184" width="592" height="190" rx="14" fill="url(#pi)" stroke="#4ade80" stroke-width="2.5"/>
  <text x="320" y="250" font-size="24" fill="#ffffff" text-anchor="middle" font-weight="700">Raspberry Pi 4 or 5</text>
  <rect x="150" y="268" width="340" height="46" rx="8" fill="#0e7490" stroke="#67e8f9" stroke-width="1.5"/>
  <text x="320" y="298" font-size="20" fill="#ffffff" text-anchor="middle" font-weight="700">Home Assistant OS</text>
  <text x="320" y="342" font-size="18" fill="#ffffff" text-anchor="middle">on an SD card or an SSD</text>
  <rect x="106" y="167" width="112" height="34" rx="6" fill="#111827" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="162" y="190.3" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="700">Ethernet</text>
  <rect x="422" y="167" width="112" height="34" rx="6" fill="#111827" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="478" y="190.3" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="700">USB-C</text>
  <rect x="106" y="357" width="112" height="34" rx="6" fill="#111827" stroke="#4ade80" stroke-width="1.5"/>
  <text x="162" y="380.3" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="700">USB 3.0</text>
  <rect x="422" y="357" width="112" height="34" rx="6" fill="#111827" stroke="#c4b5fd" stroke-width="1.5"/>
  <text x="478" y="380.3" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="700">USB 2.0</text>
  <path d="M162 144L162 167" fill="none" stroke="#3b82f6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="162" cy="144" r="5" fill="#3b82f6"/>
  <circle cx="162" cy="167" r="5" fill="#3b82f6"/>
  <path d="M478 144L478 167" fill="none" stroke="#ef4444" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="478" cy="144" r="5" fill="#ef4444"/>
  <circle cx="478" cy="167" r="5" fill="#ef4444"/>
  <path d="M162 391L162 414" fill="none" stroke="#22c55e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 6"/>
  <circle cx="162" cy="391" r="5" fill="#22c55e"/>
  <circle cx="162" cy="414" r="5" fill="#22c55e"/>
  <path d="M478 391L478 414" fill="none" stroke="#8b5cf6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="478" cy="391" r="5" fill="#8b5cf6"/>
  <circle cx="478" cy="414" r="5" fill="#8b5cf6"/>
  <rect x="24" y="414" width="276" height="74" rx="10" fill="#0f172a" stroke="#22c55e" stroke-width="2.5" stroke-dasharray="9 7"/>
  <text x="162" y="445" font-size="20" fill="#4ade80" text-anchor="middle" font-weight="700">SSD (optional)</text>
  <text x="162" y="472" font-size="18" fill="#e2e8f0" text-anchor="middle">in a blue USB 3.0 port</text>
  <rect x="340" y="414" width="276" height="74" rx="10" fill="#0f172a" stroke="#8b5cf6" stroke-width="2.5"/>
  <text x="478" y="445" font-size="20" fill="#c4b5fd" text-anchor="middle" font-weight="700">Zigbee dongle</text>
  <text x="478" y="472" font-size="18" fill="#e2e8f0" text-anchor="middle">USB 2.0 + extension cable</text>
  <rect x="24" y="508" width="592" height="72" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="320" y="536" font-size="18" fill="#e2e8f0" text-anchor="middle">Open in your browser:</text>
  <text x="320" y="564" font-size="20" fill="#67e8f9" text-anchor="middle" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">http://homeassistant.local:8123</text>
</svg>
