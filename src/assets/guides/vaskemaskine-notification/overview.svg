<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 596" role="img" lang="da" font-family="system-ui, sans-serif">
  <title>Sådan opdager Home Assistant, at vaskemaskinen er færdig</title>
  <desc>Et smart stik måler vaskemaskinens strømforbrug. Over 10 W kører maskinen. Når forbruget har været under 5 W i 3 minutter, er vasken færdig, og Home Assistant sender en besked til telefonen.</desc>
  <rect x="0" y="0" width="640" height="596" fill="#1a1a2e"/>
  <text x="320" y="46" font-size="26" fill="#e2e8f0" text-anchor="middle" font-weight="700">Sådan opdages en færdig vask</text>
  <rect x="24" y="70" width="592" height="262" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="2.5"/>
  <text x="320" y="104" font-size="20" fill="#e2e8f0" text-anchor="middle" font-weight="700">Strømforbrug under en vask</text>
  <path d="M110 284L596 284" fill="none" stroke="#334155" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="100" y="290" font-size="18" fill="#a3b1c6" text-anchor="end">0 W</text>
  <path d="M110 214L596 214" fill="none" stroke="#334155" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="100" y="220" font-size="18" fill="#a3b1c6" text-anchor="end">1000 W</text>
  <path d="M110 144L596 144" fill="none" stroke="#334155" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="100" y="150" font-size="18" fill="#a3b1c6" text-anchor="end">2000 W</text>
  <path d="M110 279.6L596 279.6" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 6"/>
  <path d="M110 283.9L126 283.9L132 273.5L140 147.5L156 144L184 146.1L210 144L222 151L230 265.8L252 271.4L280 267.2L304 272.8L330 268.6L356 273.5L376 270L392 275.6L410 263L440 250.4L462 247.6L484 251.8L496 263L504 279.8L510 283.8L596 283.9" fill="none" stroke="#60a5fa" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="596" y="262" font-size="18" fill="#fca5a5" text-anchor="end">under 5 W</text>
  <text x="140" y="316" font-size="18" fill="#a3b1c6" text-anchor="middle">Start</text>
  <text x="290" y="316" font-size="18" fill="#a3b1c6" text-anchor="middle">Vask</text>
  <text x="438" y="316" font-size="18" fill="#a3b1c6" text-anchor="middle">Centrifugering</text>
  <text x="556" y="316" font-size="18" fill="#4ade80" text-anchor="middle" font-weight="700">Færdig</text>
  <rect x="24" y="350" width="276" height="76" rx="10" fill="#2563eb"/>
  <text x="162" y="382" font-size="20" fill="#ffffff" text-anchor="middle" font-weight="700">Over 10 W</text>
  <text x="162" y="408" font-size="18" fill="#dbeafe" text-anchor="middle">maskinen kører</text>
  <path d="M306 388L321 388" fill="none" stroke="#9ca3af" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M334 388L321 380.9L321 395.1Z" fill="#9ca3af"/>
  <rect x="340" y="350" width="276" height="76" rx="10" fill="#15803d"/>
  <text x="478" y="382" font-size="20" fill="#ffffff" text-anchor="middle" font-weight="700">Under 5 W i 3 minutter</text>
  <text x="478" y="408" font-size="18" fill="#dcfce7" text-anchor="middle">vasken er færdig</text>
  <rect x="24" y="446" width="184" height="80" rx="10" fill="#0f172a" stroke="#60a5fa" stroke-width="2"/>
  <text x="116" y="478" font-size="18" fill="#60a5fa" text-anchor="middle" font-weight="700">Smart stik</text>
  <text x="116" y="504" font-size="18" fill="#e2e8f0" text-anchor="middle">måler watt</text>
  <path d="M211 486L215 486" fill="none" stroke="#9ca3af" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M225 486L215 480.5L215 491.5Z" fill="#9ca3af"/>
  <rect x="228" y="446" width="184" height="80" rx="10" fill="#0f172a" stroke="#67e8f9" stroke-width="2"/>
  <text x="320" y="478" font-size="18" fill="#67e8f9" text-anchor="middle" font-weight="700">Home Assistant</text>
  <text x="320" y="504" font-size="18" fill="#e2e8f0" text-anchor="middle">sender besked</text>
  <path d="M415 486L419 486" fill="none" stroke="#9ca3af" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M429 486L419 480.5L419 491.5Z" fill="#9ca3af"/>
  <rect x="432" y="446" width="184" height="80" rx="10" fill="#0f172a" stroke="#4ade80" stroke-width="2"/>
  <text x="524" y="478" font-size="18" fill="#4ade80" text-anchor="middle" font-weight="700">Din telefon</text>
  <text x="524" y="504" font-size="18" fill="#e2e8f0" text-anchor="middle">får beskeden</text>
  <text x="320" y="566" font-size="18" fill="#a3b1c6" text-anchor="middle">Samme metode virker til tørretumbler og opvaskemaskine.</text>
</svg>
