<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 948" role="img" lang="da" font-family="system-ui, sans-serif">
  <title>Sådan opdager Home Assistant, at vaskemaskinen er færdig</title>
  <desc>Et smart stik måler vaskemaskinens strømforbrug. Over 10 W kører maskinen. Når forbruget har været under 5 W i 3 minutter, er vasken færdig, og Home Assistant sender en besked til telefonen.</desc>
  <rect x="0" y="0" width="640" height="948" fill="#1a1a2e"/>
  <text x="320" y="44" font-size="28" fill="#e2e8f0" text-anchor="middle" font-weight="700">Sådan opdages en færdig vask</text>
  <rect x="24" y="72" width="592" height="296" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="2.5"/>
  <text x="320" y="112" font-size="24" fill="#e2e8f0" text-anchor="middle" font-weight="700">Strømforbrug under en vask</text>
  <path d="M130 304L596 304" fill="none" stroke="#334155" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="118" y="312" font-size="22" fill="#a3b1c6" text-anchor="end">0 W</text>
  <path d="M130 234L596 234" fill="none" stroke="#334155" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="118" y="242" font-size="22" fill="#a3b1c6" text-anchor="end">1000 W</text>
  <path d="M130 164L596 164" fill="none" stroke="#334155" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="118" y="172" font-size="22" fill="#a3b1c6" text-anchor="end">2000 W</text>
  <path d="M130 299.6L596 299.6" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 6"/>
  <path d="M130.0 303.9L142.5 303.9L147.2 293.5L153.4 167.5L165.9 164.0L187.7 166.1L208.0 164.0L217.4 171.0L223.6 285.8L240.8 291.4L262.6 287.2L281.3 292.8L301.6 288.6L321.9 293.5L337.5 290.0L350.0 295.6L364.0 283.0L387.4 270.4L404.6 267.6L421.7 271.8L431.1 283.0L437.3 299.8L442.0 303.8L596.0 303.9" fill="none" stroke="#60a5fa" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="596" y="282" font-size="22" fill="#fca5a5" text-anchor="end">under 5 W</text>
  <text x="150" y="346" font-size="22" fill="#a3b1c6" text-anchor="middle">Start</text>
  <text x="268" y="346" font-size="22" fill="#a3b1c6" text-anchor="middle">Vask</text>
  <text x="400" y="346" font-size="22" fill="#a3b1c6" text-anchor="middle">Centrifugering</text>
  <text x="556" y="346" font-size="22" fill="#4ade80" text-anchor="middle" font-weight="700">Færdig</text>
  <rect x="24" y="392" width="592" height="76" rx="10" fill="#2563eb"/>
  <text x="320" y="426" font-size="24" fill="#ffffff" text-anchor="middle" font-weight="700">Over 10 W</text>
  <text x="320" y="456" font-size="22" fill="#dbeafe" text-anchor="middle">maskinen kører</text>
  <path d="M320 469L320 492" fill="none" stroke="#9ca3af" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M320 503L314 492L326 492Z" fill="#9ca3af"/>
  <rect x="24" y="504" width="592" height="76" rx="10" fill="#15803d"/>
  <text x="320" y="538" font-size="24" fill="#ffffff" text-anchor="middle" font-weight="700">Under 5 W i 3 minutter</text>
  <text x="320" y="568" font-size="22" fill="#dcfce7" text-anchor="middle">vasken er færdig</text>
  <rect x="24" y="608" width="592" height="60" rx="10" fill="#0f172a" stroke="#60a5fa" stroke-width="2"/>
  <text x="44" y="645.9" font-size="22" fill="#60a5fa" font-weight="700">Smart stik</text>
  <text x="596" y="645.9" font-size="22" fill="#e2e8f0" text-anchor="end">måler watt</text>
  <path d="M320 669L320 688" fill="none" stroke="#9ca3af" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M320 699L314 688L326 688Z" fill="#9ca3af"/>
  <rect x="24" y="700" width="592" height="60" rx="10" fill="#0f172a" stroke="#67e8f9" stroke-width="2"/>
  <text x="44" y="737.9" font-size="22" fill="#67e8f9" font-weight="700">Home Assistant</text>
  <text x="596" y="737.9" font-size="22" fill="#e2e8f0" text-anchor="end">sender besked</text>
  <path d="M320 761L320 780" fill="none" stroke="#9ca3af" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M320 791L314 780L326 780Z" fill="#9ca3af"/>
  <rect x="24" y="792" width="592" height="60" rx="10" fill="#0f172a" stroke="#4ade80" stroke-width="2"/>
  <text x="44" y="829.9" font-size="22" fill="#4ade80" font-weight="700">Din telefon</text>
  <text x="596" y="829.9" font-size="22" fill="#e2e8f0" text-anchor="end">får beskeden</text>
  <text x="320" y="890" font-size="22" fill="#a3b1c6" text-anchor="middle">Samme metode virker til</text>
  <text x="320" y="920" font-size="22" fill="#a3b1c6" text-anchor="middle">tørretumbler og opvaskemaskine.</text>
</svg>
