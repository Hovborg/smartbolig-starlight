<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 586" role="img" lang="da" font-family="system-ui, sans-serif">
  <title>Det kan Shelly Wall Display</title>
  <desc>Shelly Wall Display er en 4 tommer touchskærm med indbyggede sensorer for temperatur, fugt og lysstyrke, et 5 A relæ, Home Assistant-dashboard på skærmen og termostat. Home Assistant finder den selv gennem Shelly-integrationen over WiFi 2,4 GHz. Den kræver fase (L) og neutral (N), og en dyb indmuringsdåse anbefales.</desc>
  <rect x="0" y="0" width="640" height="586" fill="#1a1a2e"/>
  <text x="320" y="46" font-size="26" fill="#e2e8f0" text-anchor="middle" font-weight="700">Shelly Wall Display: det kan den</text>
  <rect x="24" y="76" width="220" height="220" rx="20" fill="#374151" stroke="#6b7280" stroke-width="2"/>
  <rect x="40" y="92" width="188" height="188" rx="8" fill="#0b1220"/>
  <rect x="50" y="102" width="80" height="52" rx="6" fill="#1e293b"/>
  <text x="90" y="135" font-size="20" fill="#ffffff" text-anchor="middle" font-weight="700">22 °C</text>
  <rect x="138" y="102" width="80" height="52" rx="6" fill="#1e293b"/>
  <text x="178" y="135" font-size="20" fill="#ffffff" text-anchor="middle" font-weight="700">50 %</text>
  <rect x="50" y="164" width="168" height="48" rx="6" fill="#15803d"/>
  <text x="134" y="194.3" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="700">Stue</text>
  <rect x="50" y="222" width="168" height="48" rx="6" fill="#475569"/>
  <text x="134" y="252.3" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="700">Køkken</text>
  <text x="134" y="324" font-size="18" fill="#a3b1c6" text-anchor="middle">4″ touchskærm</text>
  <rect x="264" y="76" width="352" height="62" rx="8" fill="#0f172a" stroke="#22c55e" stroke-width="2"/>
  <text x="280" y="102" font-size="18" fill="#4ade80" font-weight="700">Indbyggede sensorer</text>
  <text x="280" y="126" font-size="18" fill="#e2e8f0">temperatur, fugt og lysstyrke</text>
  <rect x="264" y="146" width="352" height="62" rx="8" fill="#0f172a" stroke="#f59e0b" stroke-width="2"/>
  <text x="280" y="172" font-size="18" fill="#fbbf24" font-weight="700">5 A relæ</text>
  <text x="280" y="196" font-size="18" fill="#e2e8f0">tænder og slukker lys direkte</text>
  <rect x="264" y="216" width="352" height="62" rx="8" fill="#0f172a" stroke="#3b82f6" stroke-width="2"/>
  <text x="280" y="242" font-size="18" fill="#60a5fa" font-weight="700">Dashboard på skærmen</text>
  <text x="280" y="266" font-size="18" fill="#e2e8f0">viser Home Assistant direkte</text>
  <rect x="264" y="286" width="352" height="62" rx="8" fill="#0f172a" stroke="#ef4444" stroke-width="2"/>
  <text x="280" y="312" font-size="18" fill="#fca5a5" font-weight="700">Termostat</text>
  <text x="280" y="336" font-size="18" fill="#e2e8f0">indbygget klimastyring</text>
  <rect x="24" y="372" width="592" height="78" rx="10" fill="#172554" stroke="#3b82f6" stroke-width="2"/>
  <text x="320" y="404" font-size="20" fill="#ffffff" text-anchor="middle" font-weight="700">Home Assistant finder skærmen selv</text>
  <text x="320" y="432" font-size="18" fill="#bfdbfe" text-anchor="middle">via Shelly-integrationen · WiFi 2,4 GHz</text>
  <rect x="24" y="468" width="592" height="100" rx="10" fill="#0f172a" stroke="#f59e0b" stroke-width="2"/>
  <text x="320" y="498" font-size="18" fill="#fbbf24" text-anchor="middle" font-weight="700">Kræver</text>
  <text x="320" y="524" font-size="18" fill="#e2e8f0" text-anchor="middle">fase (L) og neutral (N) i dåsen</text>
  <text x="320" y="550" font-size="18" fill="#e2e8f0" text-anchor="middle">en dyb indmuringsdåse anbefales</text>
</svg>
