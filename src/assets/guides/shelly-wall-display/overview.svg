<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1050" role="img" lang="da" font-family="system-ui, sans-serif">
  <title>Det kan Shelly Wall Display</title>
  <desc>Shelly Wall Display er en 4 tommer touchskærm med indbyggede sensorer for temperatur, fugt og lysstyrke, et 5 A relæ, Home Assistant-dashboard på skærmen og termostat. Home Assistant finder den selv gennem Shelly-integrationen over WiFi 2,4 GHz. Den kræver fase (L) og neutral (N), og en dyb indmuringsdåse anbefales.</desc>
  <rect x="0" y="0" width="640" height="1050" fill="#1a1a2e"/>
  <text x="320" y="44" font-size="28" fill="#e2e8f0" text-anchor="middle" font-weight="700">Shelly Wall Display:</text>
  <text x="320" y="82" font-size="28" fill="#e2e8f0" text-anchor="middle" font-weight="700">det kan den</text>
  <rect x="24" y="110" width="260" height="230" rx="20" fill="#374151" stroke="#6b7280" stroke-width="2"/>
  <rect x="40" y="126" width="228" height="198" rx="8" fill="#0b1220"/>
  <rect x="50" y="136" width="98" height="54" rx="6" fill="#1e293b"/>
  <text x="99" y="170.9" font-size="22" fill="#ffffff" text-anchor="middle" font-weight="700">22 °C</text>
  <rect x="160" y="136" width="98" height="54" rx="6" fill="#1e293b"/>
  <text x="209" y="170.9" font-size="22" fill="#ffffff" text-anchor="middle" font-weight="700">50 %</text>
  <rect x="50" y="200" width="208" height="52" rx="6" fill="#15803d"/>
  <text x="154" y="233.9" font-size="22" fill="#ffffff" text-anchor="middle" font-weight="700">Stue</text>
  <rect x="50" y="262" width="208" height="52" rx="6" fill="#475569"/>
  <text x="154" y="295.9" font-size="22" fill="#ffffff" text-anchor="middle" font-weight="700">Køkken</text>
  <text x="312" y="233.6" font-size="24" fill="#ffffff" font-weight="700">4″ touchskærm</text>
  <rect x="24" y="360" width="592" height="76" rx="8" fill="#0f172a" stroke="#22c55e" stroke-width="2"/>
  <text x="44" y="392" font-size="22" fill="#4ade80" font-weight="700">Indbyggede sensorer</text>
  <text x="44" y="422" font-size="22" fill="#e2e8f0">temperatur, fugt og lysstyrke</text>
  <rect x="24" y="446" width="592" height="76" rx="8" fill="#0f172a" stroke="#f59e0b" stroke-width="2"/>
  <text x="44" y="478" font-size="22" fill="#fbbf24" font-weight="700">5 A relæ</text>
  <text x="44" y="508" font-size="22" fill="#e2e8f0">tænder og slukker lys direkte</text>
  <rect x="24" y="532" width="592" height="76" rx="8" fill="#0f172a" stroke="#3b82f6" stroke-width="2"/>
  <text x="44" y="564" font-size="22" fill="#60a5fa" font-weight="700">Dashboard på skærmen</text>
  <text x="44" y="594" font-size="22" fill="#e2e8f0">viser Home Assistant direkte</text>
  <rect x="24" y="618" width="592" height="76" rx="8" fill="#0f172a" stroke="#ef4444" stroke-width="2"/>
  <text x="44" y="650" font-size="22" fill="#fca5a5" font-weight="700">Termostat</text>
  <text x="44" y="680" font-size="22" fill="#e2e8f0">indbygget klimastyring</text>
  <rect x="24" y="714" width="592" height="164" rx="10" fill="#172554" stroke="#3b82f6" stroke-width="2"/>
  <text x="320" y="754" font-size="24" fill="#ffffff" text-anchor="middle" font-weight="700">Home Assistant finder</text>
  <text x="320" y="788" font-size="24" fill="#ffffff" text-anchor="middle" font-weight="700">skærmen selv</text>
  <text x="320" y="832" font-size="22" fill="#bfdbfe" text-anchor="middle">via Shelly-integrationen</text>
  <text x="320" y="864" font-size="22" fill="#bfdbfe" text-anchor="middle">WiFi 2,4 GHz</text>
  <rect x="24" y="898" width="592" height="128" rx="10" fill="#0f172a" stroke="#f59e0b" stroke-width="2"/>
  <text x="320" y="936" font-size="24" fill="#fbbf24" text-anchor="middle" font-weight="700">Kræver</text>
  <text x="320" y="974" font-size="22" fill="#e2e8f0" text-anchor="middle">fase (L) og neutral (N) i dåsen</text>
  <text x="320" y="1008" font-size="22" fill="#e2e8f0" text-anchor="middle">en dyb indmuringsdåse anbefales</text>
</svg>
