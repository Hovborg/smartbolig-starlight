<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1050" role="img" lang="en" font-family="system-ui, sans-serif">
  <title>What the Shelly Wall Display does</title>
  <desc>The Shelly Wall Display is a 4 inch touchscreen with built-in temperature, humidity and light sensors, a 5 A relay, a Home Assistant dashboard on the screen and a thermostat. Home Assistant finds it by itself through the Shelly integration over 2.4 GHz WiFi. It needs live (L) and neutral (N), and a deep wall box is recommended.</desc>
  <rect x="0" y="0" width="640" height="1050" fill="#1a1a2e"/>
  <text x="320" y="44" font-size="28" fill="#e2e8f0" text-anchor="middle" font-weight="700">Shelly Wall Display:</text>
  <text x="320" y="82" font-size="28" fill="#e2e8f0" text-anchor="middle" font-weight="700">what it does</text>
  <rect x="24" y="110" width="260" height="230" rx="20" fill="#374151" stroke="#6b7280" stroke-width="2"/>
  <rect x="40" y="126" width="228" height="198" rx="8" fill="#0b1220"/>
  <rect x="50" y="136" width="98" height="54" rx="6" fill="#1e293b"/>
  <text x="99" y="170.9" font-size="22" fill="#ffffff" text-anchor="middle" font-weight="700">22 °C</text>
  <rect x="160" y="136" width="98" height="54" rx="6" fill="#1e293b"/>
  <text x="209" y="170.9" font-size="22" fill="#ffffff" text-anchor="middle" font-weight="700">50 %</text>
  <rect x="50" y="200" width="208" height="52" rx="6" fill="#15803d"/>
  <text x="154" y="233.9" font-size="22" fill="#ffffff" text-anchor="middle" font-weight="700">Living Room</text>
  <rect x="50" y="262" width="208" height="52" rx="6" fill="#475569"/>
  <text x="154" y="295.9" font-size="22" fill="#ffffff" text-anchor="middle" font-weight="700">Kitchen</text>
  <text x="312" y="233.6" font-size="24" fill="#ffffff" font-weight="700">4″ touchscreen</text>
  <rect x="24" y="360" width="592" height="76" rx="8" fill="#0f172a" stroke="#22c55e" stroke-width="2"/>
  <text x="44" y="392" font-size="22" fill="#4ade80" font-weight="700">Built-in sensors</text>
  <text x="44" y="422" font-size="22" fill="#e2e8f0">temperature, humidity and light</text>
  <rect x="24" y="446" width="592" height="76" rx="8" fill="#0f172a" stroke="#f59e0b" stroke-width="2"/>
  <text x="44" y="478" font-size="22" fill="#fbbf24" font-weight="700">5 A relay</text>
  <text x="44" y="508" font-size="22" fill="#e2e8f0">switches a light directly</text>
  <rect x="24" y="532" width="592" height="76" rx="8" fill="#0f172a" stroke="#3b82f6" stroke-width="2"/>
  <text x="44" y="564" font-size="22" fill="#60a5fa" font-weight="700">Dashboard on the screen</text>
  <text x="44" y="594" font-size="22" fill="#e2e8f0">shows Home Assistant directly</text>
  <rect x="24" y="618" width="592" height="76" rx="8" fill="#0f172a" stroke="#ef4444" stroke-width="2"/>
  <text x="44" y="650" font-size="22" fill="#fca5a5" font-weight="700">Thermostat</text>
  <text x="44" y="680" font-size="22" fill="#e2e8f0">built-in climate control</text>
  <rect x="24" y="714" width="592" height="164" rx="10" fill="#172554" stroke="#3b82f6" stroke-width="2"/>
  <text x="320" y="754" font-size="24" fill="#ffffff" text-anchor="middle" font-weight="700">Home Assistant finds</text>
  <text x="320" y="788" font-size="24" fill="#ffffff" text-anchor="middle" font-weight="700">the display itself</text>
  <text x="320" y="832" font-size="22" fill="#bfdbfe" text-anchor="middle">through the Shelly integration</text>
  <text x="320" y="864" font-size="22" fill="#bfdbfe" text-anchor="middle">2.4 GHz WiFi</text>
  <rect x="24" y="898" width="592" height="128" rx="10" fill="#0f172a" stroke="#f59e0b" stroke-width="2"/>
  <text x="320" y="936" font-size="24" fill="#fbbf24" text-anchor="middle" font-weight="700">Needs</text>
  <text x="320" y="974" font-size="22" fill="#e2e8f0" text-anchor="middle">live (L) and neutral (N) in the box</text>
  <text x="320" y="1008" font-size="22" fill="#e2e8f0" text-anchor="middle">a deep wall box is recommended</text>
</svg>
