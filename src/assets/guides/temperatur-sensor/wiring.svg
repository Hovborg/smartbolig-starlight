  <path d="M44 392L80 392" fill="none" stroke="#ef4444" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="92" y="400" font-size="22" fill="#e2e8f0">VCC → 3V3</text>
  <path d="M44 430L80 430" fill="none" stroke="#facc15" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
