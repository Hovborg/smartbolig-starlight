<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 588" role="img" lang="da" font-family="system-ui, sans-serif">
  <title>DHT22-sensor koblet til ESP32 med tre ledninger</title>
  <desc>VCC går til 3V3 (3,3 V), DATA til GPIO4 og GND til GND. En nøgen 4-bens DHT22 skal have en pull-up-modstand på 4,7 kΩ mellem DATA og 3V3.</desc>
  <defs><linearGradient id="sensor" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1e40af"/><stop offset="1" stop-color="#1e3a8a"/></linearGradient><linearGradient id="esp" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1e3a5f"/><stop offset="1" stop-color="#0f172a"/></linearGradient></defs>
  <rect x="0" y="0" width="640" height="588" fill="#1a1a2e"/>
  <text x="320" y="44" font-size="28" fill="#e2e8f0" text-anchor="middle" font-weight="700">DHT22 til ESP32: ledninger</text>
  <rect x="20" y="72" width="250" height="272" rx="10" fill="url(#sensor)" stroke="#60a5fa" stroke-width="2.5"/>
  <text x="145" y="110" font-size="26" fill="#ffffff" text-anchor="middle" font-weight="700">DHT22</text>
  <rect x="370" y="72" width="250" height="272" rx="10" fill="url(#esp)" stroke="#3b82f6" stroke-width="2.5"/>
  <text x="495" y="110" font-size="26" fill="#60a5fa" text-anchor="middle" font-weight="700">ESP32</text>
  <rect x="38" y="174" width="100" height="132" rx="8" fill="#1e3a8a" stroke="#60a5fa" stroke-width="1.5"/>
