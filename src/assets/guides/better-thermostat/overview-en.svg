<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 626" role="img" lang="en" font-family="system-ui, sans-serif">
  <title>Heating with and without Better Thermostat</title>
  <desc>Without Better Thermostat the radiator thermostat (TRV) reads 24 °C at the radiator although the room is only 21 °C, and shuts off the heat too early. With Better Thermostat a sensor in the room reads 21 °C, and the thermostat is corrected to match it.</desc>
  <rect x="0" y="0" width="640" height="626" fill="#1a1a2e"/>
  <text x="320" y="46" font-size="26" fill="#e2e8f0" text-anchor="middle" font-weight="700">With and without Better Thermostat</text>
  <rect x="24" y="70" width="592" height="260" rx="10" fill="#1e293b" stroke="#ef4444" stroke-width="2.5"/>
  <text x="320" y="108" font-size="22" fill="#f87171" text-anchor="middle" font-weight="700">Without Better Thermostat</text>
  <rect x="40" y="130" width="214" height="180" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="147" y="160" font-size="18" fill="#a3b1c6" text-anchor="middle">the room</text>
  <text x="147" y="192" font-size="26" fill="#ffffff" text-anchor="middle" font-weight="700">21 °C</text>
  <rect x="56" y="252" width="76" height="44" rx="5" fill="#64748b"/>
  <path d="M71.2 258L71.2 290" fill="none" stroke="#334155" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M86.4 258L86.4 290" fill="none" stroke="#334155" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M101.6 258L101.6 290" fill="none" stroke="#334155" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M116.8 258L116.8 290" fill="none" stroke="#334155" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="132" y="262" width="26" height="24" rx="5" fill="#ef4444"/>
  <text x="110" y="240" font-size="18" fill="#fca5a5" text-anchor="middle" font-weight="700">TRV: 24 °C</text>
  <text x="272" y="166" font-size="18" fill="#e2e8f0">The TRV reads at the radiator:</text>
  <text x="272" y="194" font-size="18" fill="#e2e8f0">24 °C, while the room is 21 °C.</text>
  <text x="272" y="222" font-size="18" fill="#e2e8f0">It shuts off the heat too early.</text>
  <text x="272" y="272" font-size="18" fill="#fca5a5" font-weight="700">The room stays too cold</text>
  <rect x="24" y="348" width="592" height="260" rx="10" fill="#1e293b" stroke="#22c55e" stroke-width="2.5"/>
  <text x="320" y="386" font-size="22" fill="#4ade80" text-anchor="middle" font-weight="700">With Better Thermostat</text>
  <rect x="40" y="408" width="214" height="180" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="147" y="438" font-size="18" fill="#a3b1c6" text-anchor="middle">the room</text>
  <text x="147" y="470" font-size="26" fill="#ffffff" text-anchor="middle" font-weight="700">21 °C</text>
  <rect x="56" y="530" width="76" height="44" rx="5" fill="#64748b"/>
  <path d="M71.2 536L71.2 568" fill="none" stroke="#334155" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M86.4 536L86.4 568" fill="none" stroke="#334155" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M101.6 536L101.6 568" fill="none" stroke="#334155" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M116.8 536L116.8 568" fill="none" stroke="#334155" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="132" y="540" width="26" height="24" rx="5" fill="#22c55e"/>
  <text x="110" y="518" font-size="18" fill="#4ade80" text-anchor="middle" font-weight="700">offset −3 °C</text>
  <rect x="202" y="526" width="34" height="44" rx="6" fill="#2563eb" stroke="#60a5fa" stroke-width="1.5"/>
  <circle cx="219" cy="540" r="5" fill="#ffffff"/>
  <text x="214" y="514" font-size="18" fill="#60a5fa" text-anchor="middle">sensor</text>
  <path d="M200 554L175 554" fill="none" stroke="#60a5fa" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M164 554L175 560L175 548Z" fill="#60a5fa"/>
  <text x="272" y="444" font-size="18" fill="#e2e8f0">A room sensor reads 21 °C.</text>
  <text x="272" y="472" font-size="18" fill="#e2e8f0">Better Thermostat corrects the</text>
  <text x="272" y="500" font-size="18" fill="#e2e8f0">TRV to match it (calibration).</text>
  <text x="272" y="550" font-size="18" fill="#4ade80" font-weight="700">The heat matches the room</text>
</svg>
