<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 890" role="img" lang="en" font-family="system-ui, sans-serif">
  <title>Heating with and without Better Thermostat</title>
  <desc>Without Better Thermostat the radiator thermostat (TRV) reads 24 °C at the radiator although the room is only 21 °C, and shuts off the heat too early. With Better Thermostat a sensor in the room reads 21 °C, and the thermostat is corrected to match it.</desc>
  <rect x="0" y="0" width="640" height="890" fill="#1a1a2e"/>
  <text x="320" y="44" font-size="28" fill="#e2e8f0" text-anchor="middle" font-weight="700">With and without Better Thermostat</text>
  <rect x="24" y="72" width="592" height="388" rx="10" fill="#1e293b" stroke="#ef4444" stroke-width="2.5"/>
  <text x="320" y="112" font-size="24" fill="#f87171" text-anchor="middle" font-weight="700">Without Better Thermostat</text>
  <rect x="40" y="132" width="560" height="140" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <rect x="96" y="194" width="76" height="44" rx="5" fill="#64748b"/>
  <path d="M111.2 200L111.2 232" fill="none" stroke="#334155" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M126.4 200L126.4 232" fill="none" stroke="#334155" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M141.6 200L141.6 232" fill="none" stroke="#334155" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M156.8 200L156.8 232" fill="none" stroke="#334155" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="172" y="198" width="26" height="24" rx="5" fill="#ef4444"/>
  <text x="148" y="176" font-size="22" fill="#fca5a5" text-anchor="middle" font-weight="700">TRV: 24 °C</text>
  <text x="470" y="188" font-size="22" fill="#a3b1c6" text-anchor="middle">the room</text>
  <text x="470" y="232" font-size="30" fill="#ffffff" text-anchor="middle" font-weight="700">21 °C</text>
  <text x="48" y="312" font-size="22" fill="#e2e8f0">The TRV reads at the radiator:</text>
  <text x="48" y="342" font-size="22" fill="#e2e8f0">24 °C, while the room is 21 °C.</text>
  <text x="48" y="372" font-size="22" fill="#e2e8f0">It shuts off the heat too early.</text>
  <text x="48" y="414" font-size="22" fill="#fca5a5" font-weight="700">The room stays too cold</text>
  <rect x="24" y="478" width="592" height="388" rx="10" fill="#1e293b" stroke="#22c55e" stroke-width="2.5"/>
  <text x="320" y="518" font-size="24" fill="#4ade80" text-anchor="middle" font-weight="700">With Better Thermostat</text>
  <rect x="40" y="538" width="560" height="140" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <rect x="96" y="600" width="76" height="44" rx="5" fill="#64748b"/>
  <path d="M111.2 606L111.2 638" fill="none" stroke="#334155" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M126.4 606L126.4 638" fill="none" stroke="#334155" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M141.6 606L141.6 638" fill="none" stroke="#334155" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M156.8 606L156.8 638" fill="none" stroke="#334155" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="172" y="604" width="26" height="24" rx="5" fill="#22c55e"/>
  <text x="148" y="582" font-size="22" fill="#4ade80" text-anchor="middle" font-weight="700">offset −3 °C</text>
  <text x="470" y="594" font-size="22" fill="#a3b1c6" text-anchor="middle">the room</text>
  <text x="470" y="638" font-size="30" fill="#ffffff" text-anchor="middle" font-weight="700">21 °C</text>
  <rect x="292" y="598" width="34" height="44" rx="6" fill="#2563eb" stroke="#60a5fa" stroke-width="1.5"/>
  <circle cx="309" cy="612" r="5" fill="#ffffff"/>
  <text x="309" y="582" font-size="22" fill="#60a5fa" text-anchor="middle">sensor</text>
  <path d="M286 620L223 620" fill="none" stroke="#60a5fa" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M212 620L223 614L223 626Z" fill="#60a5fa"/>
  <text x="48" y="718" font-size="22" fill="#e2e8f0">A room sensor reads 21 °C.</text>
  <text x="48" y="748" font-size="22" fill="#e2e8f0">Better Thermostat corrects the</text>
  <text x="48" y="778" font-size="22" fill="#e2e8f0">TRV to match it (calibration).</text>
  <text x="48" y="820" font-size="22" fill="#4ade80" font-weight="700">The heat matches the room</text>
</svg>
