<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 614" role="img" lang="da" font-family="system-ui, sans-serif">
  <title>3-2-1-reglen for backup</title>
  <desc>3 kopier af dine data: originalen i Home Assistant, en backup på en NAS og en backup i skyen. 2 forskellige slags lager: disk i huset og cloud. 1 kopi uden for huset: cloud eller en disk på en anden adresse, så en brand, et tyveri eller et lynnedslag ikke tager det hele.</desc>
  <rect x="0" y="0" width="640" height="614" fill="#1a1a2e"/>
  <text x="320" y="46" font-size="26" fill="#e2e8f0" text-anchor="middle" font-weight="700">3-2-1-reglen for backup</text>
  <rect x="24" y="70" width="592" height="152" rx="10" fill="#1e293b" stroke="#2563eb" stroke-width="2"/>
  <circle cx="62" cy="106" r="22" fill="#2563eb"/>
  <text x="62" y="114.4" font-size="24" fill="#ffffff" text-anchor="middle" font-weight="700">3</text>
  <text x="98" y="113" font-size="20" fill="#60a5fa" font-weight="700">kopier af dine data</text>
  <rect x="40" y="138" width="176" height="70" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="128" y="167" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="700">Home Assistant</text>
  <text x="128" y="193" font-size="18" fill="#a3b1c6" text-anchor="middle">originalen</text>
  <rect x="232" y="138" width="176" height="70" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="320" y="167" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="700">NAS</text>
  <text x="320" y="193" font-size="18" fill="#a3b1c6" text-anchor="middle">SMB eller NFS</text>
  <rect x="424" y="138" width="176" height="70" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="512" y="167" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="700">Cloud</text>
  <text x="512" y="193" font-size="18" fill="#a3b1c6" text-anchor="middle">fx Google Drive</text>
  <rect x="24" y="236" width="592" height="152" rx="10" fill="#1e293b" stroke="#7c3aed" stroke-width="2"/>
  <circle cx="62" cy="272" r="22" fill="#7c3aed"/>
  <text x="62" y="280.4" font-size="24" fill="#ffffff" text-anchor="middle" font-weight="700">2</text>
  <text x="98" y="279" font-size="20" fill="#c4b5fd" font-weight="700">forskellige slags lager</text>
  <rect x="40" y="304" width="272" height="70" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="176" y="333" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="700">Disk i huset</text>
  <text x="176" y="359" font-size="18" fill="#a3b1c6" text-anchor="middle">server og NAS</text>
  <rect x="328" y="304" width="272" height="70" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="464" y="333" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="700">Cloud</text>
  <text x="464" y="359" font-size="18" fill="#a3b1c6" text-anchor="middle">hos en udbyder</text>
  <rect x="24" y="402" width="592" height="152" rx="10" fill="#1e293b" stroke="#15803d" stroke-width="2"/>
  <circle cx="62" cy="438" r="22" fill="#15803d"/>
  <text x="62" y="446.4" font-size="24" fill="#ffffff" text-anchor="middle" font-weight="700">1</text>
  <text x="98" y="445" font-size="20" fill="#4ade80" font-weight="700">kopi uden for huset</text>
  <rect x="40" y="470" width="560" height="70" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="320" y="499" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="700">Cloud eller en disk på en anden adresse</text>
  <text x="320" y="525" font-size="18" fill="#a3b1c6" text-anchor="middle">klarer brand, tyveri og lynnedslag</text>
  <text x="320" y="590" font-size="18" fill="#a3b1c6" text-anchor="middle">Home Assistant kan tage backup automatisk hver dag.</text>
</svg>
