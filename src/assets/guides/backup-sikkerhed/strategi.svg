<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 834" role="img" lang="da" font-family="system-ui, sans-serif">
  <title>3-2-1-reglen for backup</title>
  <desc>3 kopier af dine data: originalen i Home Assistant, en backup på en NAS og en backup i skyen. 2 forskellige slags lager: disk i huset og cloud. 1 kopi uden for huset: cloud eller en disk på en anden adresse, så en brand, et tyveri eller et lynnedslag ikke tager det hele.</desc>
  <rect x="0" y="0" width="640" height="834" fill="#1a1a2e"/>
  <text x="320" y="44" font-size="28" fill="#e2e8f0" text-anchor="middle" font-weight="700">3-2-1-reglen for backup</text>
  <rect x="24" y="72" width="592" height="262" rx="10" fill="#1e293b" stroke="#2563eb" stroke-width="2"/>
  <circle cx="64" cy="110" r="24" fill="#2563eb"/>
  <text x="64" y="120" font-size="28" fill="#ffffff" text-anchor="middle" font-weight="700">3</text>
  <text x="100" y="119" font-size="24" fill="#60a5fa" font-weight="700">kopier af dine data</text>
  <rect x="40" y="142" width="560" height="52" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="56" y="175.9" font-size="22" fill="#ffffff" font-weight="700">Home Assistant</text>
  <text x="584" y="175.9" font-size="22" fill="#a3b1c6" text-anchor="end">originalen</text>
  <rect x="40" y="204" width="560" height="52" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="56" y="237.9" font-size="22" fill="#ffffff" font-weight="700">NAS</text>
  <text x="584" y="237.9" font-size="22" fill="#a3b1c6" text-anchor="end">SMB eller NFS</text>
  <rect x="40" y="266" width="560" height="52" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="56" y="299.9" font-size="22" fill="#ffffff" font-weight="700">Cloud</text>
  <text x="584" y="299.9" font-size="22" fill="#a3b1c6" text-anchor="end">fx Google Drive</text>
  <rect x="24" y="350" width="592" height="200" rx="10" fill="#1e293b" stroke="#7c3aed" stroke-width="2"/>
  <circle cx="64" cy="388" r="24" fill="#7c3aed"/>
  <text x="64" y="398" font-size="28" fill="#ffffff" text-anchor="middle" font-weight="700">2</text>
  <text x="100" y="397" font-size="24" fill="#c4b5fd" font-weight="700">forskellige slags lager</text>
  <rect x="40" y="420" width="560" height="52" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="56" y="453.9" font-size="22" fill="#ffffff" font-weight="700">Disk i huset</text>
  <text x="584" y="453.9" font-size="22" fill="#a3b1c6" text-anchor="end">server og NAS</text>
  <rect x="40" y="482" width="560" height="52" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="56" y="515.9" font-size="22" fill="#ffffff" font-weight="700">Cloud</text>
  <text x="584" y="515.9" font-size="22" fill="#a3b1c6" text-anchor="end">hos en udbyder</text>
  <rect x="24" y="566" width="592" height="174" rx="10" fill="#1e293b" stroke="#15803d" stroke-width="2"/>
  <circle cx="64" cy="604" r="24" fill="#15803d"/>
  <text x="64" y="614" font-size="28" fill="#ffffff" text-anchor="middle" font-weight="700">1</text>
  <text x="100" y="613" font-size="24" fill="#4ade80" font-weight="700">kopi uden for huset</text>
  <rect x="40" y="636" width="560" height="88" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="320" y="672.9" font-size="22" fill="#ffffff" text-anchor="middle">Cloud eller en disk på en anden adresse</text>
  <text x="320" y="704.9" font-size="22" fill="#a3b1c6" text-anchor="middle">klarer brand, tyveri og lynnedslag</text>
  <text x="320" y="776" font-size="22" fill="#a3b1c6" text-anchor="middle">Home Assistant kan tage backup</text>
  <text x="320" y="806" font-size="22" fill="#a3b1c6" text-anchor="middle">automatisk hver dag.</text>
</svg>
