<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 834" role="img" lang="en" font-family="system-ui, sans-serif">
  <title>The 3-2-1 backup rule</title>
  <desc>3 copies of your data: the original in Home Assistant, a backup on a NAS and a backup in the cloud. 2 different kinds of storage: a disk at home and the cloud. 1 copy away from home: the cloud or a disk at another address, so a fire, a theft or a lightning strike does not take everything.</desc>
  <rect x="0" y="0" width="640" height="834" fill="#1a1a2e"/>
  <text x="320" y="44" font-size="28" fill="#e2e8f0" text-anchor="middle" font-weight="700">The 3-2-1 backup rule</text>
  <rect x="24" y="72" width="592" height="262" rx="10" fill="#1e293b" stroke="#2563eb" stroke-width="2"/>
  <circle cx="64" cy="110" r="24" fill="#2563eb"/>
  <text x="64" y="120" font-size="28" fill="#ffffff" text-anchor="middle" font-weight="700">3</text>
  <text x="100" y="119" font-size="24" fill="#60a5fa" font-weight="700">copies of your data</text>
  <rect x="40" y="142" width="560" height="52" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="56" y="175.9" font-size="22" fill="#ffffff" font-weight="700">Home Assistant</text>
  <text x="584" y="175.9" font-size="22" fill="#a3b1c6" text-anchor="end">the original</text>
  <rect x="40" y="204" width="560" height="52" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="56" y="237.9" font-size="22" fill="#ffffff" font-weight="700">NAS</text>
  <text x="584" y="237.9" font-size="22" fill="#a3b1c6" text-anchor="end">SMB or NFS</text>
  <rect x="40" y="266" width="560" height="52" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="56" y="299.9" font-size="22" fill="#ffffff" font-weight="700">Cloud</text>
  <text x="584" y="299.9" font-size="22" fill="#a3b1c6" text-anchor="end">e.g. Google Drive</text>
  <rect x="24" y="350" width="592" height="200" rx="10" fill="#1e293b" stroke="#7c3aed" stroke-width="2"/>
  <circle cx="64" cy="388" r="24" fill="#7c3aed"/>
  <text x="64" y="398" font-size="28" fill="#ffffff" text-anchor="middle" font-weight="700">2</text>
  <text x="100" y="397" font-size="24" fill="#c4b5fd" font-weight="700">different kinds of storage</text>
  <rect x="40" y="420" width="560" height="52" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="56" y="453.9" font-size="22" fill="#ffffff" font-weight="700">Disk at home</text>
  <text x="584" y="453.9" font-size="22" fill="#a3b1c6" text-anchor="end">server and NAS</text>
  <rect x="40" y="482" width="560" height="52" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="56" y="515.9" font-size="22" fill="#ffffff" font-weight="700">Cloud</text>
  <text x="584" y="515.9" font-size="22" fill="#a3b1c6" text-anchor="end">at a provider</text>
  <rect x="24" y="566" width="592" height="174" rx="10" fill="#1e293b" stroke="#15803d" stroke-width="2"/>
  <circle cx="64" cy="604" r="24" fill="#15803d"/>
  <text x="64" y="614" font-size="28" fill="#ffffff" text-anchor="middle" font-weight="700">1</text>
  <text x="100" y="613" font-size="24" fill="#4ade80" font-weight="700">copy away from home</text>
  <rect x="40" y="636" width="560" height="88" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="320" y="672.9" font-size="22" fill="#ffffff" text-anchor="middle">The cloud or a disk at another address</text>
  <text x="320" y="704.9" font-size="22" fill="#a3b1c6" text-anchor="middle">survives fire, theft and lightning</text>
  <text x="320" y="776" font-size="22" fill="#a3b1c6" text-anchor="middle">Home Assistant can back up</text>
  <text x="320" y="806" font-size="22" fill="#a3b1c6" text-anchor="middle">automatically every day.</text>
</svg>
