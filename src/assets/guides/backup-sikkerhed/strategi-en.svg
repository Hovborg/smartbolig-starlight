<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 614" role="img" lang="en" font-family="system-ui, sans-serif">
  <title>The 3-2-1 backup rule</title>
  <desc>3 copies of your data: the original in Home Assistant, a backup on a NAS and a backup in the cloud. 2 different kinds of storage: a disk at home and the cloud. 1 copy away from home: the cloud or a disk at another address, so a fire, a theft or a lightning strike does not take everything.</desc>
  <rect x="0" y="0" width="640" height="614" fill="#1a1a2e"/>
  <text x="320" y="46" font-size="26" fill="#e2e8f0" text-anchor="middle" font-weight="700">The 3-2-1 backup rule</text>
  <rect x="24" y="70" width="592" height="152" rx="10" fill="#1e293b" stroke="#2563eb" stroke-width="2"/>
  <circle cx="62" cy="106" r="22" fill="#2563eb"/>
  <text x="62" y="114.4" font-size="24" fill="#ffffff" text-anchor="middle" font-weight="700">3</text>
  <text x="98" y="113" font-size="20" fill="#60a5fa" font-weight="700">copies of your data</text>
  <rect x="40" y="138" width="176" height="70" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="128" y="167" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="700">Home Assistant</text>
  <text x="128" y="193" font-size="18" fill="#a3b1c6" text-anchor="middle">the original</text>
  <rect x="232" y="138" width="176" height="70" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="320" y="167" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="700">NAS</text>
  <text x="320" y="193" font-size="18" fill="#a3b1c6" text-anchor="middle">SMB or NFS</text>
  <rect x="424" y="138" width="176" height="70" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="512" y="167" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="700">Cloud</text>
  <text x="512" y="193" font-size="18" fill="#a3b1c6" text-anchor="middle">e.g. Google Drive</text>
  <rect x="24" y="236" width="592" height="152" rx="10" fill="#1e293b" stroke="#7c3aed" stroke-width="2"/>
  <circle cx="62" cy="272" r="22" fill="#7c3aed"/>
  <text x="62" y="280.4" font-size="24" fill="#ffffff" text-anchor="middle" font-weight="700">2</text>
  <text x="98" y="279" font-size="20" fill="#c4b5fd" font-weight="700">different kinds of storage</text>
  <rect x="40" y="304" width="272" height="70" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="176" y="333" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="700">Disk at home</text>
  <text x="176" y="359" font-size="18" fill="#a3b1c6" text-anchor="middle">server and NAS</text>
  <rect x="328" y="304" width="272" height="70" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="464" y="333" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="700">Cloud</text>
  <text x="464" y="359" font-size="18" fill="#a3b1c6" text-anchor="middle">at a provider</text>
  <rect x="24" y="402" width="592" height="152" rx="10" fill="#1e293b" stroke="#15803d" stroke-width="2"/>
  <circle cx="62" cy="438" r="22" fill="#15803d"/>
  <text x="62" y="446.4" font-size="24" fill="#ffffff" text-anchor="middle" font-weight="700">1</text>
  <text x="98" y="445" font-size="20" fill="#4ade80" font-weight="700">copy away from home</text>
  <rect x="40" y="470" width="560" height="70" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="320" y="499" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="700">The cloud or a disk at another address</text>
  <text x="320" y="525" font-size="18" fill="#a3b1c6" text-anchor="middle">survives fire, theft and lightning</text>
  <text x="320" y="590" font-size="18" fill="#a3b1c6" text-anchor="middle">Home Assistant can back up automatically every day.</text>
</svg>
