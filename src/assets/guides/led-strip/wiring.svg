<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 780" role="img" lang="da" font-family="system-ui, sans-serif">
  <title>WS2812B LED-strip koblet til ESP32 og en 5 V strømforsyning</title>
  <desc>Strømforsyningens +5V går til strippens +5V. ESP32'ens GPIO16 går til strippens DIN. GND fra strømforsyningen, ESP32 og strippen er forbundet. ESP32 får sin strøm fra USB.</desc>
  <defs><linearGradient id="psu" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3a3220"/><stop offset="1" stop-color="#1f2937"/></linearGradient><linearGradient id="esp" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1e3a5f"/><stop offset="1" stop-color="#0f172a"/></linearGradient><linearGradient id="led" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ef4444"/><stop offset="1" stop-color="#3b82f6"/></linearGradient></defs>
  <rect x="0" y="0" width="640" height="780" fill="#1a1a2e"/>
  <text x="320" y="44" font-size="28" fill="#e2e8f0" text-anchor="middle" font-weight="700">LED-strip til ESP32: ledninger</text>
  <rect x="24" y="72" width="592" height="148" rx="10" fill="url(#psu)" stroke="#f59e0b" stroke-width="2.5"/>
  <text x="320" y="110" font-size="24" fill="#fbbf24" text-anchor="middle" font-weight="700">5 V strømforsyning</text>
  <text x="320" y="142" font-size="22" fill="#e2e8f0" text-anchor="middle">mindst 4 A til 60 LED'er</text>
  <rect x="40" y="168" width="80" height="40" rx="6" fill="#dc2626"/>
