  <text x="560" y="195.9" font-size="22" fill="#ffffff" text-anchor="middle" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">GND</text>
  <rect x="120" y="262" width="280" height="140" rx="10" fill="url(#esp)" stroke="#3b82f6" stroke-width="2.5"/>
  <text x="260" y="300" font-size="26" fill="#60a5fa" text-anchor="middle" font-weight="700">ESP32</text>
  <text x="260" y="332" font-size="22" fill="#a3b1c6" text-anchor="middle">strøm fra USB</text>
