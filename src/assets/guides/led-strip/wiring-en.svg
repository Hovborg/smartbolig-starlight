  <text x="350" y="298.3" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">GND</text>
  <rect x="24" y="446" width="592" height="86" rx="10" fill="#171717" stroke="#6b7280" stroke-width="2"/>
