  <text x="92" y="452.3" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">+5V</text>
  <rect x="228" y="429" width="84" height="34" rx="6" fill="#22c55e"/>
