<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 650" role="img" lang="en" font-family="system-ui, sans-serif">
  <title>WS2812B LED strip wired to an ESP32 and a 5 V power supply</title>
  <desc>The power supply's +5V goes to the strip's +5V. GPIO16 on the ESP32 goes to DIN on the strip. GND of the power supply, the ESP32 and the strip are joined. The ESP32 is powered from USB.</desc>
  <defs><linearGradient id="psu" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3a3220"/><stop offset="1" stop-color="#1f2937"/></linearGradient><linearGradient id="esp" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1e3a5f"/><stop offset="1" stop-color="#0f172a"/></linearGradient><linearGradient id="led" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ef4444"/><stop offset="1" stop-color="#3b82f6"/></linearGradient></defs>
  <rect x="0" y="0" width="640" height="650" fill="#1a1a2e"/>
  <text x="320" y="46" font-size="26" fill="#e2e8f0" text-anchor="middle" font-weight="700">LED strip to ESP32: wiring</text>
  <rect x="36" y="76" width="568" height="88" rx="10" fill="url(#psu)" stroke="#f59e0b" stroke-width="2.5"/>
  <text x="320" y="112" font-size="22" fill="#fbbf24" text-anchor="middle" font-weight="700">5 V power supply</text>
  <text x="320" y="142" font-size="18" fill="#e2e8f0" text-anchor="middle">at least 3 A for 60 LEDs</text>
  <rect x="50" y="103" width="84" height="34" rx="6" fill="#dc2626"/>
  <text x="92" y="126.3" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">+5V</text>
  <rect x="506" y="103" width="84" height="34" rx="6" fill="#111827" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="548" y="126.3" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">GND</text>
  <rect x="110" y="214" width="290" height="150" rx="10" fill="url(#esp)" stroke="#3b82f6" stroke-width="2.5"/>
  <text x="210" y="252" font-size="24" fill="#60a5fa" text-anchor="middle" font-weight="700">ESP32</text>
  <text x="210" y="280" font-size="18" fill="#a3b1c6" text-anchor="middle">powered from USB</text>
  <rect x="222" y="319" width="96" height="34" rx="6" fill="#22c55e"/>
  <text x="270" y="342.3" font-size="18" fill="#0b1220" text-anchor="middle" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">GPIO16</text>
