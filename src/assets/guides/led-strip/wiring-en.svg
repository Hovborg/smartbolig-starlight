  <rect x="506" y="429" width="84" height="34" rx="6" fill="#111827" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="548" y="452.3" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">GND</text>
  <text x="320" y="562" font-size="18" fill="#c4b5fd" text-anchor="middle">WS2812B LED strip, 60 LEDs per metre</text>
