  <rect x="24" y="582" width="592" height="50" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <path d="M92.6 607L122.6 607" fill="none" stroke="#ef4444" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="130.6" y="613.3" font-size="18" fill="#e2e8f0">+5V → +5V</text>
  <path d="M244.8 607L274.8 607" fill="none" stroke="#22c55e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="282.8" y="613.3" font-size="18" fill="#e2e8f0">GPIO16 → DIN</text>
  <path d="M425.2 607L455.2 607" fill="none" stroke="#9ca3af" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="463.2" y="613.3" font-size="18" fill="#e2e8f0">GND → GND</text>
