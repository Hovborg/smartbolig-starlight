<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 476" role="img" lang="da" font-family="system-ui, sans-serif">
  <title>PIR-sensor HC-SR501 koblet til ESP32 med tre ledninger</title>
  <desc>VCC går til 5V eller VIN, OUT til GPIO13 og GND til GND. OUT giver et 3,3 V-signal, når sensoren ser bevægelse.</desc>
  <defs><linearGradient id="sensor" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#065f46"/><stop offset="1" stop-color="#064e3b"/></linearGradient><linearGradient id="esp" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1e3a5f"/><stop offset="1" stop-color="#0f172a"/></linearGradient></defs>
  <rect x="0" y="0" width="640" height="476" fill="#1a1a2e"/>
  <text x="320" y="46" font-size="26" fill="#e2e8f0" text-anchor="middle" font-weight="700">PIR-sensor til ESP32: ledninger</text>
  <rect x="24" y="76" width="226" height="256" rx="10" fill="url(#sensor)" stroke="#34d399" stroke-width="2.5"/>
  <text x="96" y="114" font-size="24" fill="#ffffff" text-anchor="middle" font-weight="700">PIR</text>
  <circle cx="96" cy="208" r="46" fill="#0f766e" stroke="#5eead4" stroke-width="2"/>
  <circle cx="96" cy="208" r="27" fill="#99f6e4" opacity="0.85"/>
  <path d="M80 198Q96 182 112 198" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
  <rect x="154" y="159" width="92" height="34" rx="6" fill="#dc2626"/>
  <text x="200" y="182.3" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">VCC</text>
  <rect x="154" y="211" width="92" height="34" rx="6" fill="#facc15"/>
  <text x="200" y="234.3" font-size="18" fill="#0b1220" text-anchor="middle" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">OUT</text>
  <rect x="154" y="263" width="92" height="34" rx="6" fill="#111827" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="200" y="286.3" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">GND</text>
  <rect x="390" y="76" width="226" height="256" rx="10" fill="url(#esp)" stroke="#3b82f6" stroke-width="2.5"/>
  <text x="503" y="114" font-size="24" fill="#60a5fa" text-anchor="middle" font-weight="700">ESP32</text>
  <rect x="394" y="159" width="92" height="34" rx="6" fill="#dc2626"/>
  <text x="440" y="182.3" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">5V/VIN</text>
  <rect x="394" y="211" width="92" height="34" rx="6" fill="#facc15"/>
  <text x="440" y="234.3" font-size="18" fill="#0b1220" text-anchor="middle" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">GPIO13</text>
  <rect x="394" y="263" width="92" height="34" rx="6" fill="#111827" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="440" y="286.3" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">GND</text>
  <rect x="530" y="288" width="70" height="32" rx="5" fill="#374151" stroke="#6b7280" stroke-width="1.5"/>
  <text x="565" y="310.3" font-size="18" fill="#d1d5db" text-anchor="middle">USB</text>
  <path d="M250 176L390 176" fill="none" stroke="#ef4444" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="250" cy="176" r="5" fill="#ef4444"/>
  <circle cx="390" cy="176" r="5" fill="#ef4444"/>
  <path d="M250 228L390 228" fill="none" stroke="#facc15" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="250" cy="228" r="5" fill="#facc15"/>
  <circle cx="390" cy="228" r="5" fill="#facc15"/>
  <path d="M250 280L390 280" fill="none" stroke="#9ca3af" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="250" cy="280" r="5" fill="#9ca3af"/>
  <circle cx="390" cy="280" r="5" fill="#9ca3af"/>
  <text x="96" y="310" font-size="18" fill="#d1fae5" text-anchor="middle">HC-SR501</text>
  <rect x="24" y="352" width="592" height="50" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <path d="M68.5 377L98.5 377" fill="none" stroke="#ef4444" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="106.5" y="383.3" font-size="18" fill="#e2e8f0">VCC → 5V/VIN</text>
  <path d="M247.5 377L277.5 377" fill="none" stroke="#facc15" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="285.5" y="383.3" font-size="18" fill="#e2e8f0">OUT → GPIO13</text>
  <path d="M430.5 377L460.5 377" fill="none" stroke="#9ca3af" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="468.5" y="383.3" font-size="18" fill="#e2e8f0">GND → GND</text>
  <text x="320" y="444" font-size="18" fill="#a3b1c6" text-anchor="middle">OUT går høj (3,3 V), når sensoren ser bevægelse.</text>
</svg>
