<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 588" role="img" lang="da" font-family="system-ui, sans-serif">
  <title>PIR-sensor HC-SR501 koblet til ESP32 med tre ledninger</title>
  <desc>VCC går til 5V eller VIN, OUT til GPIO13 og GND til GND. OUT giver et 3,3 V-signal, når sensoren ser bevægelse.</desc>
  <defs><linearGradient id="sensor" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#065f46"/><stop offset="1" stop-color="#064e3b"/></linearGradient><linearGradient id="esp" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1e3a5f"/><stop offset="1" stop-color="#0f172a"/></linearGradient></defs>
  <rect x="0" y="0" width="640" height="588" fill="#1a1a2e"/>
  <text x="320" y="44" font-size="28" fill="#e2e8f0" text-anchor="middle" font-weight="700">PIR-sensor til ESP32: ledninger</text>
  <rect x="20" y="72" width="250" height="272" rx="10" fill="url(#sensor)" stroke="#34d399" stroke-width="2.5"/>
  <text x="145" y="110" font-size="26" fill="#ffffff" text-anchor="middle" font-weight="700">PIR</text>
  <text x="145" y="146" font-size="22" fill="#d1fae5" text-anchor="middle">HC-SR501</text>
  <rect x="370" y="72" width="250" height="272" rx="10" fill="url(#esp)" stroke="#3b82f6" stroke-width="2.5"/>
  <text x="495" y="110" font-size="26" fill="#60a5fa" text-anchor="middle" font-weight="700">ESP32</text>
  <circle cx="88" cy="234" r="46" fill="#0f766e" stroke="#5eead4" stroke-width="2"/>
  <circle cx="88" cy="234" r="27" fill="#99f6e4" opacity="0.85"/>
  <path d="M72 224Q88 208 104 224" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
  <rect x="148" y="172" width="118" height="40" rx="6" fill="#dc2626"/>
  <text x="207" y="199.9" font-size="22" fill="#ffffff" text-anchor="middle" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">VCC</text>
  <rect x="374" y="172" width="118" height="40" rx="6" fill="#dc2626"/>
  <text x="433" y="199.9" font-size="22" fill="#ffffff" text-anchor="middle" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">5V/VIN</text>
  <path d="M270 192L370 192" fill="none" stroke="#ef4444" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="270" cy="192" r="5" fill="#ef4444"/>
  <circle cx="370" cy="192" r="5" fill="#ef4444"/>
  <rect x="148" y="228" width="118" height="40" rx="6" fill="#facc15"/>
  <text x="207" y="255.9" font-size="22" fill="#0b1220" text-anchor="middle" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">OUT</text>
  <rect x="374" y="228" width="118" height="40" rx="6" fill="#facc15"/>
  <text x="433" y="255.9" font-size="22" fill="#0b1220" text-anchor="middle" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">GPIO13</text>
  <path d="M270 248L370 248" fill="none" stroke="#facc15" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="270" cy="248" r="5" fill="#facc15"/>
  <circle cx="370" cy="248" r="5" fill="#facc15"/>
  <rect x="148" y="284" width="118" height="40" rx="6" fill="#111827" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="207" y="311.9" font-size="22" fill="#ffffff" text-anchor="middle" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">GND</text>
  <rect x="374" y="284" width="118" height="40" rx="6" fill="#111827" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="433" y="311.9" font-size="22" fill="#ffffff" text-anchor="middle" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">GND</text>
  <path d="M270 304L370 304" fill="none" stroke="#9ca3af" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="270" cy="304" r="5" fill="#9ca3af"/>
  <circle cx="370" cy="304" r="5" fill="#9ca3af"/>
  <rect x="520" y="282" width="84" height="44" rx="5" fill="#374151" stroke="#6b7280" stroke-width="1.5"/>
  <text x="562" y="311.9" font-size="22" fill="#d1d5db" text-anchor="middle">USB</text>
  <rect x="24" y="366" width="592" height="128" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <path d="M44 392L80 392" fill="none" stroke="#ef4444" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="92" y="400" font-size="22" fill="#e2e8f0">VCC → 5V/VIN</text>
  <path d="M44 430L80 430" fill="none" stroke="#facc15" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="92" y="438" font-size="22" fill="#e2e8f0">OUT → GPIO13</text>
  <path d="M44 468L80 468" fill="none" stroke="#9ca3af" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="92" y="476" font-size="22" fill="#e2e8f0">GND → GND</text>
  <text x="320" y="528" font-size="22" fill="#a3b1c6" text-anchor="middle">OUT går høj (3,3 V), når</text>
  <text x="320" y="558" font-size="22" fill="#a3b1c6" text-anchor="middle">sensoren ser bevægelse.</text>
</svg>
