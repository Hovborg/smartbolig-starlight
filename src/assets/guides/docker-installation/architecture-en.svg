<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 656" role="img" lang="en" font-family="system-ui, sans-serif">
  <title>Home Assistant, Mosquitto and Zigbee2MQTT as containers in Docker</title>
  <desc>On a Linux server or NAS, Docker Engine runs three containers: Home Assistant (port 8123, network_mode: host), Mosquitto as the MQTT broker (port 1883) and Zigbee2MQTT (port 8080, Zigbee dongle on /dev/ttyACM0). Home Assistant and Zigbee2MQTT talk to each other through Mosquitto over MQTT. Mosquitto and Zigbee2MQTT are optional.</desc>
  <defs><linearGradient id="eng" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0ea5e9"/><stop offset="1" stop-color="#0369a1"/></linearGradient></defs>
  <rect x="0" y="0" width="640" height="656" fill="#1a1a2e"/>
  <text x="320" y="44" font-size="28" fill="#e2e8f0" text-anchor="middle" font-weight="700">Home Assistant in Docker</text>
  <rect x="16" y="72" width="608" height="568" rx="14" fill="#1e293b" stroke="#475569" stroke-width="2.5"/>
  <text x="36" y="108" font-size="22" fill="#a3b1c6">Linux server or NAS</text>
  <rect x="36" y="124" width="568" height="48" rx="8" fill="url(#eng)"/>
  <text x="320" y="156.6" font-size="24" fill="#ffffff" text-anchor="middle" font-weight="700">Docker Engine</text>
  <rect x="36" y="188" width="568" height="104" rx="10" fill="#0e7490" stroke="#67e8f9" stroke-width="2"/>
  <text x="56" y="228" font-size="24" fill="#ffffff" font-weight="700">Home Assistant</text>
  <text x="586" y="228" font-size="22" fill="#ffffff" text-anchor="end" font-family="ui-monospace, Menlo, Consolas, monospace">port 8123</text>
  <text x="56" y="268" font-size="22" fill="#ffffff">container</text>
  <text x="586" y="268" font-size="22" fill="#ffffff" text-anchor="end" font-family="ui-monospace, Menlo, Consolas, monospace">network_mode: host</text>
  <path d="M300 293L300 324" fill="none" stroke="#9ca3af" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M300 335L294 324L306 324Z" fill="#9ca3af"/>
  <path d="M300 293L306 304L294 304Z" fill="#9ca3af"/>
  <text x="318" y="322" font-size="22" fill="#e2e8f0">MQTT</text>
  <rect x="36" y="336" width="568" height="104" rx="10" fill="#6d28d9" stroke="#c4b5fd" stroke-width="2"/>
  <text x="56" y="376" font-size="24" fill="#ffffff" font-weight="700">Mosquitto</text>
  <text x="586" y="376" font-size="22" fill="#ffffff" text-anchor="end" font-family="ui-monospace, Menlo, Consolas, monospace">port 1883</text>
  <text x="56" y="416" font-size="22" fill="#ffffff">MQTT broker (optional)</text>
  <path d="M300 441L300 472" fill="none" stroke="#9ca3af" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M300 483L294 472L306 472Z" fill="#9ca3af"/>
  <path d="M300 441L306 452L294 452Z" fill="#9ca3af"/>
  <text x="318" y="470" font-size="22" fill="#e2e8f0">MQTT</text>
  <rect x="36" y="484" width="568" height="140" rx="10" fill="#b45309" stroke="#fbbf24" stroke-width="2"/>
  <text x="56" y="524" font-size="24" fill="#ffffff" font-weight="700">Zigbee2MQTT</text>
  <text x="586" y="524" font-size="22" fill="#ffffff" text-anchor="end" font-family="ui-monospace, Menlo, Consolas, monospace">port 8080</text>
  <text x="56" y="564" font-size="22" fill="#ffffff">Zigbee over a USB dongle</text>
  <text x="56" y="602" font-size="22" fill="#ffffff">(optional)</text>
  <text x="586" y="602" font-size="22" fill="#ffffff" text-anchor="end" font-family="ui-monospace, Menlo, Consolas, monospace">/dev/ttyACM0</text>
</svg>
