<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 692" role="img" lang="en" font-family="system-ui, sans-serif">
  <title>LD2410C mmWave radar wired to an ESP32 with four wires</title>
  <desc>VCC goes to 5V or VIN, GND to GND, the sensor's TX to GPIO16, which is the ESP32's RX, and the sensor's RX to GPIO17, which is the ESP32's TX. OUT is not used. VCC needs 5 V; the signals are 3.3 V.</desc>
  <defs><linearGradient id="sensor" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6d28d9"/><stop offset="1" stop-color="#4c1d95"/></linearGradient><linearGradient id="esp" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1e3a5f"/><stop offset="1" stop-color="#0f172a"/></linearGradient></defs>
  <rect x="0" y="0" width="640" height="692" fill="#1a1a2e"/>
  <text x="320" y="44" font-size="28" fill="#e2e8f0" text-anchor="middle" font-weight="700">LD2410 to ESP32: wiring</text>
  <rect x="20" y="72" width="250" height="384" rx="10" fill="url(#sensor)" stroke="#a78bfa" stroke-width="2.5"/>
  <text x="145" y="110" font-size="26" fill="#ffffff" text-anchor="middle" font-weight="700">LD2410C</text>
  <text x="145" y="146" font-size="22" fill="#ede9fe" text-anchor="middle">mmWave radar</text>
  <rect x="370" y="72" width="250" height="384" rx="10" fill="url(#esp)" stroke="#3b82f6" stroke-width="2.5"/>
  <text x="495" y="110" font-size="26" fill="#60a5fa" text-anchor="middle" font-weight="700">ESP32</text>
  <rect x="38" y="178" width="94" height="250" rx="8" fill="#2e1065" stroke="#c4b5fd" stroke-width="1.5"/>
  <path d="M58 202L58 302" fill="none" stroke="#c4b5fd" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
  <rect x="47" y="196" width="22" height="16" rx="3" fill="#c4b5fd"/>
  <rect x="47" y="234" width="22" height="16" rx="3" fill="#c4b5fd"/>
  <rect x="47" y="272" width="22" height="16" rx="3" fill="#c4b5fd"/>
  <path d="M98 202L98 302" fill="none" stroke="#c4b5fd" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
  <rect x="87" y="196" width="22" height="16" rx="3" fill="#c4b5fd"/>
  <rect x="87" y="234" width="22" height="16" rx="3" fill="#c4b5fd"/>
  <rect x="87" y="272" width="22" height="16" rx="3" fill="#c4b5fd"/>
  <rect x="60" y="342" width="50" height="60" rx="4" fill="#0b1220" stroke="#c4b5fd" stroke-width="1.5"/>
  <rect x="148" y="172" width="118" height="40" rx="6" fill="#22c55e"/>
  <text x="207" y="199.9" font-size="22" fill="#0b1220" text-anchor="middle" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">TX</text>
  <rect x="374" y="172" width="118" height="40" rx="6" fill="#22c55e"/>
  <text x="433" y="199.9" font-size="22" fill="#0b1220" text-anchor="middle" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">GPIO16</text>
  <path d="M270 192L370 192" fill="none" stroke="#22c55e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="270" cy="192" r="5" fill="#22c55e"/>
  <circle cx="370" cy="192" r="5" fill="#22c55e"/>
  <text x="510" y="200" font-size="22" fill="#4ade80" font-weight="700">RX</text>
  <rect x="148" y="228" width="118" height="40" rx="6" fill="#2563eb"/>
  <text x="207" y="255.9" font-size="22" fill="#ffffff" text-anchor="middle" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">RX</text>
  <rect x="374" y="228" width="118" height="40" rx="6" fill="#2563eb"/>
  <text x="433" y="255.9" font-size="22" fill="#ffffff" text-anchor="middle" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">GPIO17</text>
  <path d="M270 248L370 248" fill="none" stroke="#3b82f6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="270" cy="248" r="5" fill="#3b82f6"/>
  <circle cx="370" cy="248" r="5" fill="#3b82f6"/>
  <text x="510" y="256" font-size="22" fill="#60a5fa" font-weight="700">TX</text>
  <rect x="148" y="284" width="118" height="40" rx="6" fill="#1e1b4b" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="207" y="311.9" font-size="22" fill="#fbbf24" text-anchor="middle" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">OUT</text>
  <path d="M270 304L326 304" fill="none" stroke="#f59e0b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 6"/>
  <text x="390" y="312" font-size="22" fill="#a3b1c6">not used</text>
  <rect x="148" y="340" width="118" height="40" rx="6" fill="#111827" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="207" y="367.9" font-size="22" fill="#ffffff" text-anchor="middle" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">GND</text>
  <rect x="374" y="340" width="118" height="40" rx="6" fill="#111827" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="433" y="367.9" font-size="22" fill="#ffffff" text-anchor="middle" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">GND</text>
  <path d="M270 360L370 360" fill="none" stroke="#9ca3af" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="270" cy="360" r="5" fill="#9ca3af"/>
  <circle cx="370" cy="360" r="5" fill="#9ca3af"/>
  <rect x="148" y="396" width="118" height="40" rx="6" fill="#dc2626"/>
  <text x="207" y="423.9" font-size="22" fill="#ffffff" text-anchor="middle" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">VCC</text>
  <rect x="374" y="396" width="118" height="40" rx="6" fill="#dc2626"/>
  <text x="433" y="423.9" font-size="22" fill="#ffffff" text-anchor="middle" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">5V/VIN</text>
  <path d="M270 416L370 416" fill="none" stroke="#ef4444" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="270" cy="416" r="5" fill="#ef4444"/>
  <circle cx="370" cy="416" r="5" fill="#ef4444"/>
  <rect x="520" y="394" width="84" height="44" rx="5" fill="#374151" stroke="#6b7280" stroke-width="1.5"/>
  <text x="562" y="423.9" font-size="22" fill="#d1d5db" text-anchor="middle">USB</text>
  <rect x="24" y="478" width="592" height="90" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <path d="M44 504L80 504" fill="none" stroke="#22c55e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="92" y="512" font-size="22" fill="#e2e8f0">TX → GPIO16</text>
  <path d="M322 504L358 504" fill="none" stroke="#3b82f6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="370" y="512" font-size="22" fill="#e2e8f0">RX → GPIO17</text>
  <path d="M44 542L80 542" fill="none" stroke="#9ca3af" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="92" y="550" font-size="22" fill="#e2e8f0">GND → GND</text>
  <path d="M322 542L358 542" fill="none" stroke="#ef4444" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="370" y="550" font-size="22" fill="#e2e8f0">VCC → 5V/VIN</text>
  <text x="320" y="602" font-size="22" fill="#a3b1c6" text-anchor="middle">The sensor's TX goes to the ESP32's RX,</text>
  <text x="320" y="632" font-size="22" fill="#a3b1c6" text-anchor="middle">and the sensor's RX to the ESP32's TX.</text>
  <text x="320" y="662" font-size="22" fill="#a3b1c6" text-anchor="middle">VCC needs 5 V. The signals are 3.3 V.</text>
</svg>
