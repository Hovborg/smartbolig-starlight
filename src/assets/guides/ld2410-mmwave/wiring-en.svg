<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 618" role="img" lang="en" font-family="system-ui, sans-serif">
  <title>LD2410C mmWave radar wired to an ESP32 with four wires</title>
  <desc>VCC goes to 5V or VIN, GND to GND, the sensor's TX to GPIO16, which is the ESP32's RX, and the sensor's RX to GPIO17, which is the ESP32's TX. OUT is not used. VCC needs 5 V; the signals are 3.3 V.</desc>
  <defs><linearGradient id="sensor" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6d28d9"/><stop offset="1" stop-color="#4c1d95"/></linearGradient><linearGradient id="esp" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1e3a5f"/><stop offset="1" stop-color="#0f172a"/></linearGradient></defs>
  <rect x="0" y="0" width="640" height="618" fill="#1a1a2e"/>
  <text x="320" y="46" font-size="26" fill="#e2e8f0" text-anchor="middle" font-weight="700">LD2410 to ESP32: wiring</text>
  <rect x="24" y="76" width="226" height="352" rx="10" fill="url(#sensor)" stroke="#a78bfa" stroke-width="2.5"/>
  <text x="96" y="114" font-size="24" fill="#ffffff" text-anchor="middle" font-weight="700">LD2410C</text>
  <text x="96" y="140" font-size="18" fill="#ede9fe" text-anchor="middle">mmWave radar</text>
  <rect x="46" y="206" width="100" height="140" rx="8" fill="#2e1065" stroke="#c4b5fd" stroke-width="1.5"/>
  <path d="M76 232L76 282" fill="none" stroke="#c4b5fd" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
  <rect x="65" y="224" width="22" height="16" rx="3" fill="#c4b5fd"/>
  <rect x="65" y="249" width="22" height="16" rx="3" fill="#c4b5fd"/>
  <rect x="65" y="274" width="22" height="16" rx="3" fill="#c4b5fd"/>
  <path d="M116 232L116 282" fill="none" stroke="#c4b5fd" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
  <rect x="105" y="224" width="22" height="16" rx="3" fill="#c4b5fd"/>
  <rect x="105" y="249" width="22" height="16" rx="3" fill="#c4b5fd"/>
  <rect x="105" y="274" width="22" height="16" rx="3" fill="#c4b5fd"/>
  <rect x="78" y="306" width="36" height="26" rx="4" fill="#0b1220" stroke="#c4b5fd" stroke-width="1.5"/>
  <rect x="390" y="76" width="226" height="352" rx="10" fill="url(#esp)" stroke="#3b82f6" stroke-width="2.5"/>
  <text x="503" y="114" font-size="24" fill="#60a5fa" text-anchor="middle" font-weight="700">ESP32</text>
  <rect x="394" y="159" width="92" height="34" rx="6" fill="#dc2626"/>
  <text x="440" y="182.3" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">5V/VIN</text>
  <rect x="394" y="211" width="92" height="34" rx="6" fill="#111827" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="440" y="234.3" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">GND</text>
  <rect x="394" y="263" width="92" height="34" rx="6" fill="#22c55e"/>
  <text x="440" y="286.3" font-size="18" fill="#0b1220" text-anchor="middle" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">GPIO16</text>
  <rect x="394" y="315" width="92" height="34" rx="6" fill="#2563eb"/>
  <text x="440" y="338.3" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">GPIO17</text>
  <rect x="530" y="384" width="70" height="32" rx="5" fill="#374151" stroke="#6b7280" stroke-width="1.5"/>
  <text x="565" y="406.3" font-size="18" fill="#d1d5db" text-anchor="middle">USB</text>
  <rect x="154" y="159" width="92" height="34" rx="6" fill="#dc2626"/>
  <text x="200" y="182.3" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">VCC</text>
  <path d="M250 176L390 176" fill="none" stroke="#ef4444" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="250" cy="176" r="5" fill="#ef4444"/>
  <circle cx="390" cy="176" r="5" fill="#ef4444"/>
  <rect x="154" y="211" width="92" height="34" rx="6" fill="#111827" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="200" y="234.3" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">GND</text>
  <path d="M250 228L390 228" fill="none" stroke="#9ca3af" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="250" cy="228" r="5" fill="#9ca3af"/>
  <circle cx="390" cy="228" r="5" fill="#9ca3af"/>
  <rect x="154" y="263" width="92" height="34" rx="6" fill="#22c55e"/>
  <text x="200" y="286.3" font-size="18" fill="#0b1220" text-anchor="middle" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">TX</text>
  <path d="M250 280L390 280" fill="none" stroke="#22c55e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="250" cy="280" r="5" fill="#22c55e"/>
  <circle cx="390" cy="280" r="5" fill="#22c55e"/>
  <text x="498" y="286.3" font-size="18" fill="#4ade80" font-weight="700">RX</text>
  <rect x="154" y="315" width="92" height="34" rx="6" fill="#2563eb"/>
  <text x="200" y="338.3" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">RX</text>
  <path d="M250 332L390 332" fill="none" stroke="#3b82f6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="250" cy="332" r="5" fill="#3b82f6"/>
  <circle cx="390" cy="332" r="5" fill="#3b82f6"/>
  <text x="498" y="338.3" font-size="18" fill="#60a5fa" font-weight="700">TX</text>
  <rect x="154" y="367" width="92" height="34" rx="6" fill="#1e1b4b" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="200" y="390.3" font-size="18" fill="#fbbf24" text-anchor="middle" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">OUT</text>
  <text x="262" y="390.3" font-size="18" fill="#a3b1c6">not used</text>
  <rect x="24" y="448" width="592" height="88" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <path d="M92 475L122 475" fill="none" stroke="#ef4444" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="130" y="481.3" font-size="18" fill="#e2e8f0">VCC → 5V/VIN</text>
  <path d="M92 509L122 509" fill="none" stroke="#9ca3af" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="130" y="515.3" font-size="18" fill="#e2e8f0">GND → GND</text>
  <path d="M392 475L422 475" fill="none" stroke="#22c55e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="430" y="481.3" font-size="18" fill="#e2e8f0">TX → GPIO16</text>
  <path d="M392 509L422 509" fill="none" stroke="#3b82f6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="430" y="515.3" font-size="18" fill="#e2e8f0">RX → GPIO17</text>
  <text x="320" y="570" font-size="18" fill="#a3b1c6" text-anchor="middle">RX and TX cross: the sensor's TX goes to the ESP32's RX.</text>
  <text x="320" y="596" font-size="18" fill="#a3b1c6" text-anchor="middle">VCC needs 5 V. The signals are 3.3 V.</text>
</svg>
