<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 612" role="img" lang="en" font-family="system-ui, sans-serif">
  <title>PIR sensor and mmWave radar compared</title>
  <desc>A PIR sensor detects motion but not a person sitting still, so the light goes out. An mmWave radar such as the LD2410 detects both motion and a person sitting still, so the light stays on.</desc>
  <rect x="0" y="0" width="640" height="612" fill="#1a1a2e"/>
  <text x="320" y="46" font-size="26" fill="#e2e8f0" text-anchor="middle" font-weight="700">PIR or mmWave?</text>
  <rect x="24" y="70" width="592" height="250" rx="10" fill="#1e293b" stroke="#ef4444" stroke-width="2.5"/>
  <text x="320" y="108" font-size="22" fill="#f87171" text-anchor="middle" font-weight="700">PIR sensor</text>
  <path d="M104 182L548 136V228Z" fill="#ef4444" opacity="0.16"/>
  <rect x="44" y="156" width="60" height="52" rx="8" fill="#374151" stroke="#6b7280" stroke-width="1.5"/>
  <circle cx="74" cy="182" r="13" fill="#ef4444"/>
  <circle cx="250" cy="153" r="11" fill="#22c55e"/>
  <path d="M250 164V194M234 178L250 172L266 182M250 194L236 220M250 194L266 220" fill="none" stroke="#22c55e" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M280 174h20M280 188h14" fill="none" stroke="#22c55e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="462" cy="153" r="11" fill="#ef4444"/>
  <path d="M462 164V194M462 174L478 186M462 194H482V220" fill="none" stroke="#ef4444" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M450 164V200H474M450 200V220" fill="none" stroke="#4b5563" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="250" y="248" font-size="18" fill="#e2e8f0" text-anchor="middle" font-weight="700">Motion</text>
  <path d="M197.6 268L204.3 274.3L215.6 261.7" fill="none" stroke="#4ade80" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="262" y="274" font-size="18" fill="#4ade80" text-anchor="middle">detected</text>
  <text x="462" y="248" font-size="18" fill="#e2e8f0" text-anchor="middle" font-weight="700">Sitting still</text>
  <path d="M391.8 260L407.8 276M407.8 260L391.8 276" fill="none" stroke="#ef4444" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="474" y="274" font-size="18" fill="#fca5a5" text-anchor="middle">not detected</text>
  <text x="320" y="306" font-size="18" fill="#a3b1c6" text-anchor="middle">The light goes out while you sit still.</text>
  <rect x="24" y="340" width="592" height="250" rx="10" fill="#1e293b" stroke="#22c55e" stroke-width="2.5"/>
  <text x="320" y="378" font-size="22" fill="#4ade80" text-anchor="middle" font-weight="700">mmWave radar (LD2410)</text>
  <path d="M152.8 406A70 70 0 0 1 152.8 498" fill="none" stroke="#60a5fa" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.45"/>
  <path d="M221.6 406A130 130 0 0 1 221.6 498" fill="none" stroke="#60a5fa" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.45"/>
  <path d="M284.3 406A190 190 0 0 1 284.3 498" fill="none" stroke="#60a5fa" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.45"/>
  <path d="M345.7 406A250 250 0 0 1 345.7 498" fill="none" stroke="#60a5fa" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.45"/>
  <path d="M406.6 406A310 310 0 0 1 406.6 498" fill="none" stroke="#60a5fa" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.45"/>
  <path d="M467.1 406A370 370 0 0 1 467.1 498" fill="none" stroke="#60a5fa" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.45"/>
  <path d="M527.5 406A430 430 0 0 1 527.5 498" fill="none" stroke="#60a5fa" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.45"/>
  <rect x="44" y="426" width="60" height="52" rx="8" fill="#374151" stroke="#6b7280" stroke-width="1.5"/>
  <rect x="56" y="440" width="36" height="24" rx="4" fill="#3b82f6"/>
  <circle cx="250" cy="423" r="11" fill="#22c55e"/>
  <path d="M250 434V464M234 448L250 442L266 452M250 464L236 490M250 464L266 490" fill="none" stroke="#22c55e" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M280 444h20M280 458h14" fill="none" stroke="#22c55e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="462" cy="423" r="11" fill="#22c55e"/>
  <path d="M462 434V464M462 444L478 456M462 464H482V490" fill="none" stroke="#22c55e" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M450 434V470H474M450 470V490" fill="none" stroke="#4b5563" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="250" y="518" font-size="18" fill="#e2e8f0" text-anchor="middle" font-weight="700">Motion</text>
  <path d="M197.6 538L204.3 544.3L215.6 531.7" fill="none" stroke="#4ade80" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="262" y="544" font-size="18" fill="#4ade80" text-anchor="middle">detected</text>
  <text x="462" y="518" font-size="18" fill="#e2e8f0" text-anchor="middle" font-weight="700">Sitting still</text>
  <path d="M409.6 538L416.3 544.3L427.6 531.7" fill="none" stroke="#4ade80" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="474" y="544" font-size="18" fill="#4ade80" text-anchor="middle">detected</text>
  <text x="320" y="576" font-size="18" fill="#a3b1c6" text-anchor="middle">The light stays on while you are in the room.</text>
</svg>
