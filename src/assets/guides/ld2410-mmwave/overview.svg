<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 792" role="img" lang="da" font-family="system-ui, sans-serif">
  <title>PIR-sensor og mmWave-radar sammenlignet</title>
  <desc>En PIR-sensor registrerer bevægelse, men ikke en person, der sidder stille, så lyset slukker. En mmWave-radar som LD2410 registrerer både bevægelse og en person, der sidder stille, så lyset bliver tændt.</desc>
  <rect x="0" y="0" width="640" height="792" fill="#1a1a2e"/>
  <text x="320" y="44" font-size="28" fill="#e2e8f0" text-anchor="middle" font-weight="700">PIR eller mmWave?</text>
  <rect x="24" y="72" width="592" height="324" rx="10" fill="#1e293b" stroke="#ef4444" stroke-width="2.5"/>
  <text x="320" y="112" font-size="24" fill="#f87171" text-anchor="middle" font-weight="700">PIR-sensor</text>
  <path d="M104 188L560 142V234Z" fill="#ef4444" opacity="0.16"/>
  <rect x="44" y="162" width="60" height="52" rx="8" fill="#374151" stroke="#6b7280" stroke-width="1.5"/>
  <circle cx="74" cy="188" r="13" fill="#ef4444"/>
  <circle cx="230" cy="159" r="11" fill="#22c55e"/>
  <path d="M230 170V200M214 184L230 178L246 188M230 200L216 226M230 200L246 226" fill="none" stroke="#22c55e" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M260 180h20M260 194h14" fill="none" stroke="#22c55e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="440" cy="159" r="11" fill="#ef4444"/>
  <path d="M440 170V200M440 180L456 192M440 200H460V226" fill="none" stroke="#ef4444" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M428 170V206H452M428 206V226" fill="none" stroke="#4b5563" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="230" y="298" font-size="22" fill="#e2e8f0" text-anchor="middle" font-weight="700">Bevægelse</text>
  <text x="440" y="298" font-size="22" fill="#e2e8f0" text-anchor="middle" font-weight="700">Sidder stille</text>
  <path d="M134 324L141 330L152 317" fill="none" stroke="#4ade80" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="160" y="336" font-size="22" fill="#4ade80">registreres</text>
  <path d="M346 319L362 335M362 319L346 335" fill="none" stroke="#ef4444" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="370" y="336" font-size="22" fill="#fca5a5">registreres ikke</text>
  <text x="320" y="376" font-size="22" fill="#a3b1c6" text-anchor="middle">Lyset slukker, mens du sidder stille.</text>
  <rect x="24" y="414" width="592" height="354" rx="10" fill="#1e293b" stroke="#22c55e" stroke-width="2.5"/>
  <text x="320" y="454" font-size="24" fill="#4ade80" text-anchor="middle" font-weight="700">mmWave-radar (LD2410)</text>
  <path d="M152.8 484A70 70 0 0 1 152.8 576" fill="none" stroke="#60a5fa" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.45"/>
  <path d="M221.6 484A130 130 0 0 1 221.6 576" fill="none" stroke="#60a5fa" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.45"/>
  <path d="M284.3 484A190 190 0 0 1 284.3 576" fill="none" stroke="#60a5fa" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.45"/>
