  <path d="M406.6 484A310 310 0 0 1 406.6 576" fill="none" stroke="#60a5fa" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.45"/>
  <path d="M467.1 484A370 370 0 0 1 467.1 576" fill="none" stroke="#60a5fa" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.45"/>
  <path d="M527.5 484A430 430 0 0 1 527.5 576" fill="none" stroke="#60a5fa" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.45"/>
  <rect x="44" y="504" width="60" height="52" rx="8" fill="#374151" stroke="#6b7280" stroke-width="1.5"/>
  <rect x="56" y="518" width="36" height="24" rx="4" fill="#3b82f6"/>
  <circle cx="230" cy="501" r="11" fill="#22c55e"/>
  <path d="M230 512V542M214 526L230 520L246 530M230 542L216 568M230 542L246 568" fill="none" stroke="#22c55e" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M260 522h20M260 536h14" fill="none" stroke="#22c55e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="440" cy="501" r="11" fill="#22c55e"/>
  <path d="M440 512V542M440 522L456 534M440 542H460V568" fill="none" stroke="#22c55e" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M428 512V548H452M428 548V568" fill="none" stroke="#4b5563" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="230" y="640" font-size="22" fill="#e2e8f0" text-anchor="middle" font-weight="700">Bevægelse</text>
  <text x="440" y="640" font-size="22" fill="#e2e8f0" text-anchor="middle" font-weight="700">Sidder stille</text>
  <path d="M134 666L141 672L152 659" fill="none" stroke="#4ade80" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="160" y="678" font-size="22" fill="#4ade80">registreres</text>
  <path d="M344 666L351 672L362 659" fill="none" stroke="#4ade80" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="370" y="678" font-size="22" fill="#4ade80">registreres</text>
  <text x="320" y="718" font-size="22" fill="#a3b1c6" text-anchor="middle">Lyset bliver tændt, så længe</text>
  <text x="320" y="748" font-size="22" fill="#a3b1c6" text-anchor="middle">du er i rummet.</text>
</svg>
