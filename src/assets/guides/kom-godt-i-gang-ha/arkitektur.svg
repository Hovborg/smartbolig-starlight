<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 786" role="img" lang="da" font-family="system-ui, sans-serif">
  <title>Sådan hænger Home Assistant sammen</title>
  <desc>Home Assistant kører automationer. Du betjener det fra dashboardet i en browser eller i appen til iOS og Android. Integrationer som Philips Hue, Sonos og ESPHome forbinder mærker og tjenester. Apps (tidligere add-ons) som Zigbee2MQTT, Node-RED og File editor kører ved siden af. Enheder og sensorer forbindes over Zigbee, WiFi, Z-Wave, Matter eller cloud.</desc>
