  <text x="320" y="44" font-size="28" fill="#e2e8f0" text-anchor="middle" font-weight="700">Sådan hænger Home</text>
  <text x="320" y="82" font-size="28" fill="#e2e8f0" text-anchor="middle" font-weight="700">Assistant sammen</text>
  <rect x="120" y="110" width="400" height="84" rx="10" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <text x="320" y="146" font-size="24" fill="#ffffff" text-anchor="middle" font-weight="700">Dashboard og app</text>
  <text x="320" y="178" font-size="22" fill="#a3b1c6" text-anchor="middle">browser · iOS · Android</text>
