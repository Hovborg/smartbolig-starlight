<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 600" role="img" lang="da" font-family="system-ui, sans-serif">
  <title>Sådan hænger Home Assistant sammen</title>
  <desc>Home Assistant står i midten og kører automationer. Du betjener det fra dashboardet i en browser eller i appen til iOS og Android. Integrationer som Philips Hue, Sonos og ESPHome forbinder mærker og tjenester. Apps (tidligere add-ons) som Zigbee2MQTT, Node-RED og File editor kører ved siden af. Enheder og sensorer forbindes over Zigbee, WiFi, Z-Wave, Matter eller cloud.</desc>
  <defs><linearGradient id="core" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0891b2"/><stop offset="1" stop-color="#0e7490"/></linearGradient></defs>
  <rect x="0" y="0" width="640" height="600" fill="#1a1a2e"/>
  <text x="320" y="46" font-size="24" fill="#e2e8f0" text-anchor="middle" font-weight="700">Sådan hænger Home Assistant sammen</text>
  <rect x="150" y="70" width="340" height="76" rx="10" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <text x="320" y="101" font-size="20" fill="#ffffff" text-anchor="middle" font-weight="700">Dashboard og app</text>
  <text x="320" y="129" font-size="18" fill="#a3b1c6" text-anchor="middle">browser · iOS · Android</text>
  <path d="M320 146L320 186" fill="none" stroke="#06b6d4" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="24" y="186" width="180" height="212" rx="10" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <text x="114" y="218" font-size="20" fill="#4ade80" text-anchor="middle" font-weight="700">Integrationer</text>
  <rect x="34" y="239" width="160" height="38" rx="6" fill="#15803d"/>
  <text x="114" y="264.3" font-size="18" fill="#ffffff" text-anchor="middle">Philips Hue</text>
  <rect x="34" y="287" width="160" height="38" rx="6" fill="#15803d"/>
  <text x="114" y="312.3" font-size="18" fill="#ffffff" text-anchor="middle">Sonos</text>
  <rect x="34" y="335" width="160" height="38" rx="6" fill="#15803d"/>
  <text x="114" y="360.3" font-size="18" fill="#ffffff" text-anchor="middle">ESPHome</text>
  <rect x="436" y="186" width="180" height="212" rx="10" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <text x="526" y="218" font-size="20" fill="#fbbf24" text-anchor="middle" font-weight="700">Apps</text>
  <rect x="446" y="239" width="160" height="38" rx="6" fill="#b45309"/>
  <text x="526" y="264.3" font-size="18" fill="#ffffff" text-anchor="middle">Zigbee2MQTT</text>
  <rect x="446" y="287" width="160" height="38" rx="6" fill="#b45309"/>
  <text x="526" y="312.3" font-size="18" fill="#ffffff" text-anchor="middle">Node-RED</text>
  <rect x="446" y="335" width="160" height="38" rx="6" fill="#b45309"/>
  <text x="526" y="360.3" font-size="18" fill="#ffffff" text-anchor="middle">File editor</text>
  <path d="M204 292L224 292" fill="none" stroke="#22c55e" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M416 292L436 292" fill="none" stroke="#f59e0b" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="224" y="212" width="192" height="160" rx="14" fill="url(#core)" stroke="#67e8f9" stroke-width="3"/>
  <text x="320" y="274" font-size="22" fill="#ffffff" text-anchor="middle" font-weight="700">Home Assistant</text>
  <text x="320" y="306" font-size="18" fill="#ffffff" text-anchor="middle">automationer</text>
  <text x="320" y="332" font-size="18" fill="#ffffff" text-anchor="middle">og historik</text>
  <path d="M320 372L320 428" fill="none" stroke="#8b5cf6" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="24" y="428" width="592" height="150" rx="10" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <text x="320" y="460" font-size="20" fill="#c4b5fd" text-anchor="middle" font-weight="700">Enheder og sensorer</text>
  <rect x="32" y="480" width="104" height="40" rx="6" fill="#7c3aed"/>
  <text x="84" y="506.3" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="700">Zigbee</text>
  <rect x="150" y="480" width="104" height="40" rx="6" fill="#7c3aed"/>
  <text x="202" y="506.3" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="700">WiFi</text>
  <rect x="268" y="480" width="104" height="40" rx="6" fill="#7c3aed"/>
  <text x="320" y="506.3" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="700">Z-Wave</text>
  <rect x="386" y="480" width="104" height="40" rx="6" fill="#7c3aed"/>
  <text x="438" y="506.3" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="700">Matter</text>
  <rect x="504" y="480" width="104" height="40" rx="6" fill="#7c3aed"/>
  <text x="556" y="506.3" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="700">Cloud</text>
  <text x="320" y="556" font-size="18" fill="#a3b1c6" text-anchor="middle">pærer · sensorer · stik · låse · tjenester</text>
</svg>
