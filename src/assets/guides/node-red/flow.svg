<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 548" role="img" lang="da" font-family="system-ui, sans-serif">
  <title>Eksempel på et Node-RED-flow, der tænder og slukker lys efter en bevægelsessensor</title>
  <desc>Noden events: state lytter på en bevægelsessensor. En switch-node sender beskeden videre efter tilstanden. Ved on sætter en function-node lysstyrken til 80 %, og en action-node kalder light.turn_on. Ved off venter en delay-node 5 minutter, og en action-node kalder light.turn_off.</desc>
  <rect x="0" y="0" width="640" height="548" fill="#1a1a2e"/>
  <text x="320" y="46" font-size="26" fill="#e2e8f0" text-anchor="middle" font-weight="700">Eksempel på et Node-RED-flow</text>
  <rect x="206" y="70" width="228" height="66" rx="8" fill="#7dd3fc" stroke="#0369a1" stroke-width="2"/>
  <rect x="207" y="71" width="24" height="64" rx="7" fill="#0369a1" opacity="0.4"/>
  <text x="332" y="97" font-size="18" fill="#0b1220" text-anchor="middle" font-weight="700">events: state</text>
  <text x="332" y="122" font-size="18" fill="#0b1220" text-anchor="middle">bevægelsessensor</text>
  <path d="M320 138L320 147" fill="none" stroke="#9ca3af" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M320 158L326.1 147L313.9 147Z" fill="#9ca3af"/>
  <rect x="206" y="160" width="228" height="66" rx="8" fill="#fde68a" stroke="#a16207" stroke-width="2"/>
  <rect x="207" y="161" width="24" height="64" rx="7" fill="#a16207" opacity="0.4"/>
  <text x="332" y="187" font-size="18" fill="#0b1220" text-anchor="middle" font-weight="700">switch</text>
  <text x="332" y="212" font-size="18" fill="#0b1220" text-anchor="middle">on eller off?</text>
  <path d="M320 228V252M170 252H470" fill="none" stroke="#9ca3af" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M170 252L170 287" fill="none" stroke="#9ca3af" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M170 298L176.1 287L163.9 287Z" fill="#9ca3af"/>
  <path d="M470 252L470 287" fill="none" stroke="#9ca3af" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M470 298L476.1 287L463.9 287Z" fill="#9ca3af"/>
  <text x="184" y="284" font-size="18" fill="#4ade80" font-weight="700">on</text>
  <text x="456" y="284" font-size="18" fill="#fca5a5" text-anchor="end" font-weight="700">off</text>
  <rect x="56" y="300" width="228" height="66" rx="8" fill="#fdba74" stroke="#c2410c" stroke-width="2"/>
  <rect x="57" y="301" width="24" height="64" rx="7" fill="#c2410c" opacity="0.4"/>
  <text x="182" y="327" font-size="18" fill="#0b1220" text-anchor="middle" font-weight="700">function</text>
  <text x="182" y="352" font-size="18" fill="#0b1220" text-anchor="middle">lysstyrke 80 %</text>
  <rect x="356" y="300" width="228" height="66" rx="8" fill="#ddd6fe" stroke="#6d28d9" stroke-width="2"/>
  <rect x="357" y="301" width="24" height="64" rx="7" fill="#6d28d9" opacity="0.4"/>
  <text x="482" y="327" font-size="18" fill="#0b1220" text-anchor="middle" font-weight="700">delay</text>
  <text x="482" y="352" font-size="18" fill="#0b1220" text-anchor="middle">5 minutter</text>
  <path d="M170 368L170 377" fill="none" stroke="#9ca3af" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M170 388L176.1 377L163.9 377Z" fill="#9ca3af"/>
  <path d="M470 368L470 377" fill="none" stroke="#9ca3af" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M470 388L476.1 377L463.9 377Z" fill="#9ca3af"/>
  <rect x="56" y="390" width="228" height="66" rx="8" fill="#7dd3fc" stroke="#0369a1" stroke-width="2"/>
  <rect x="57" y="391" width="24" height="64" rx="7" fill="#0369a1" opacity="0.4"/>
  <text x="182" y="417" font-size="18" fill="#0b1220" text-anchor="middle" font-weight="700">action</text>
  <text x="182" y="442" font-size="18" fill="#0b1220" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">light.turn_on</text>
  <rect x="356" y="390" width="228" height="66" rx="8" fill="#7dd3fc" stroke="#0369a1" stroke-width="2"/>
  <rect x="357" y="391" width="24" height="64" rx="7" fill="#0369a1" opacity="0.4"/>
