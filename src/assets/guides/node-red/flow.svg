  <text x="482" y="442" font-size="18" fill="#0b1220" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">light.turn_off</text>
  <rect x="24" y="480" width="592" height="50" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <rect x="89.6" y="494" width="22" height="22" rx="4" fill="#7dd3fc" stroke="#0369a1" stroke-width="1.5"/>
  <text x="119.6" y="511.3" font-size="18" fill="#e2e8f0">Home Assistant-node</text>
  <rect x="337.4" y="494" width="22" height="22" rx="4" fill="#fde68a" stroke="#a16207" stroke-width="1.5"/>
  <rect x="363.4" y="494" width="22" height="22" rx="4" fill="#fdba74" stroke="#c2410c" stroke-width="1.5"/>
  <rect x="389.4" y="494" width="22" height="22" rx="4" fill="#ddd6fe" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="419.4" y="511.3" font-size="18" fill="#e2e8f0">indbygget node</text>
</svg>
