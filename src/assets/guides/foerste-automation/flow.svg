<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 888" role="img" lang="da" font-family="system-ui, sans-serif">
  <title>En automation har tre dele: trigger, betingelse og handling</title>
  <desc>Triggeren starter automationen, for eksempel bevægelse, solnedgang eller et klokkeslæt. Betingelsen afgør, om den må køre, for eksempel kun om natten. Handlingen er det, der sker, for eksempel at lyset tændes. Eksempel: Når der er bevægelse i gangen, og klokken er mellem 22:00 og 07:00, tændes lyset på 20 % og slukkes efter 2 minutter.</desc>
  <rect x="0" y="0" width="640" height="888" fill="#1a1a2e"/>
  <text x="320" y="44" font-size="28" fill="#e2e8f0" text-anchor="middle" font-weight="700">En automation har tre dele</text>
  <rect x="24" y="72" width="592" height="124" rx="10" fill="#1e293b" stroke="#fbbf24" stroke-width="2"/>
  <path d="M235 73H35Q25 73 25 83V185Q25 195 35 195H235Z" fill="#b45309"/>
  <text x="130" y="126" font-size="24" fill="#ffffff" text-anchor="middle" font-weight="700">Trigger</text>
  <text x="130" y="162" font-size="22" fill="#ffffff" text-anchor="middle">Hvornår?</text>
  <text x="256" y="112" font-size="22" fill="#e2e8f0">bevægelse</text>
  <text x="256" y="146" font-size="22" fill="#e2e8f0">solnedgang</text>
  <text x="256" y="180" font-size="22" fill="#e2e8f0">klokken 07:00</text>
  <path d="M130 197L130 218" fill="none" stroke="#9ca3af" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M130 229L124 218L136 218Z" fill="#9ca3af"/>
  <rect x="24" y="230" width="592" height="124" rx="10" fill="#1e293b" stroke="#60a5fa" stroke-width="2"/>
  <path d="M235 231H35Q25 231 25 241V343Q25 353 35 353H235Z" fill="#2563eb"/>
  <text x="130" y="284" font-size="24" fill="#ffffff" text-anchor="middle" font-weight="700">Betingelse</text>
  <text x="130" y="320" font-size="22" fill="#ffffff" text-anchor="middle">Kun hvis?</text>
  <text x="256" y="270" font-size="22" fill="#e2e8f0">kun om natten</text>
  <text x="256" y="304" font-size="22" fill="#e2e8f0">nogen er hjemme</text>
  <text x="256" y="338" font-size="22" fill="#e2e8f0">lyset er slukket</text>
  <path d="M130 355L130 376" fill="none" stroke="#9ca3af" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M130 387L124 376L136 376Z" fill="#9ca3af"/>
  <rect x="24" y="388" width="592" height="124" rx="10" fill="#1e293b" stroke="#4ade80" stroke-width="2"/>
  <path d="M235 389H35Q25 389 25 399V501Q25 511 35 511H235Z" fill="#15803d"/>
  <text x="130" y="442" font-size="24" fill="#ffffff" text-anchor="middle" font-weight="700">Handling</text>
  <text x="130" y="478" font-size="22" fill="#ffffff" text-anchor="middle">Hvad sker der?</text>
  <text x="256" y="428" font-size="22" fill="#e2e8f0">tænd lyset</text>
  <text x="256" y="462" font-size="22" fill="#e2e8f0">send en besked</text>
  <text x="256" y="496" font-size="22" fill="#e2e8f0">sluk igen senere</text>
  <rect x="24" y="538" width="592" height="326" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="320" y="580" font-size="24" fill="#ffffff" text-anchor="middle" font-weight="700">Eksempel: lys i gangen om natten</text>
  <rect x="40" y="610" width="176" height="44" rx="6" fill="#b45309"/>
  <text x="128" y="639.9" font-size="22" fill="#ffffff" text-anchor="middle" font-weight="700">Trigger</text>
  <text x="236" y="639.9" font-size="22" fill="#e2e8f0">bevægelse i gangen</text>
  <rect x="40" y="690" width="176" height="44" rx="6" fill="#2563eb"/>
  <text x="128" y="719.9" font-size="22" fill="#ffffff" text-anchor="middle" font-weight="700">Betingelse</text>
  <text x="236" y="704.9" font-size="22" fill="#e2e8f0">klokken er mellem</text>
  <text x="236" y="734.9" font-size="22" fill="#e2e8f0">22:00 og 07:00</text>
  <rect x="40" y="782" width="176" height="44" rx="6" fill="#15803d"/>
  <text x="128" y="811.9" font-size="22" fill="#ffffff" text-anchor="middle" font-weight="700">Handling</text>
  <text x="236" y="796.9" font-size="22" fill="#e2e8f0">tænd lyset på 20 %,</text>
  <text x="236" y="826.9" font-size="22" fill="#e2e8f0">sluk efter 2 minutter</text>
</svg>
