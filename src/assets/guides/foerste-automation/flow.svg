<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 534" role="img" lang="da" font-family="system-ui, sans-serif">
  <title>En automation har tre dele: trigger, betingelse og handling</title>
  <desc>Triggeren starter automationen, for eksempel bevægelse, solnedgang eller et klokkeslæt. Betingelsen afgør, om den må køre, for eksempel kun om natten. Handlingen er det, der sker, for eksempel at lyset tændes. Eksempel: Når der er bevægelse i gangen, og klokken er mellem 22:00 og 07:00, tændes lyset på 20 % og slukkes efter 2 minutter.</desc>
  <rect x="0" y="0" width="640" height="534" fill="#1a1a2e"/>
  <text x="320" y="46" font-size="26" fill="#e2e8f0" text-anchor="middle" font-weight="700">En automation har tre dele</text>
  <rect x="24" y="70" width="184" height="224" rx="10" fill="#1e293b" stroke="#fbbf24" stroke-width="2"/>
  <rect x="25" y="71" width="182" height="50" rx="9" fill="#b45309"/>
  <rect x="25" y="100" width="182" height="21" fill="#b45309"/>
  <text x="116" y="103" font-size="20" fill="#ffffff" text-anchor="middle" font-weight="700">Trigger</text>
  <text x="116" y="156" font-size="18" fill="#fbbf24" text-anchor="middle" font-weight="700">Hvornår?</text>
  <text x="116" y="196" font-size="18" fill="#e2e8f0" text-anchor="middle">bevægelse</text>
  <text x="116" y="230" font-size="18" fill="#e2e8f0" text-anchor="middle">solnedgang</text>
  <text x="116" y="264" font-size="18" fill="#e2e8f0" text-anchor="middle">klokken 07:00</text>
  <path d="M210 182L218 182" fill="none" stroke="#9ca3af" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M227 182L218 177.1L218 186.9Z" fill="#9ca3af"/>
  <rect x="228" y="70" width="184" height="224" rx="10" fill="#1e293b" stroke="#60a5fa" stroke-width="2"/>
  <rect x="229" y="71" width="182" height="50" rx="9" fill="#2563eb"/>
  <rect x="229" y="100" width="182" height="21" fill="#2563eb"/>
  <text x="320" y="103" font-size="20" fill="#ffffff" text-anchor="middle" font-weight="700">Betingelse</text>
  <text x="320" y="156" font-size="18" fill="#60a5fa" text-anchor="middle" font-weight="700">Kun hvis?</text>
  <text x="320" y="196" font-size="18" fill="#e2e8f0" text-anchor="middle">kun om natten</text>
  <text x="320" y="230" font-size="18" fill="#e2e8f0" text-anchor="middle">nogen er hjemme</text>
  <text x="320" y="264" font-size="18" fill="#e2e8f0" text-anchor="middle">lyset er slukket</text>
  <path d="M414 182L422 182" fill="none" stroke="#9ca3af" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M431 182L422 177.1L422 186.9Z" fill="#9ca3af"/>
  <rect x="432" y="70" width="184" height="224" rx="10" fill="#1e293b" stroke="#4ade80" stroke-width="2"/>
  <rect x="433" y="71" width="182" height="50" rx="9" fill="#15803d"/>
  <rect x="433" y="100" width="182" height="21" fill="#15803d"/>
  <text x="524" y="103" font-size="20" fill="#ffffff" text-anchor="middle" font-weight="700">Handling</text>
  <text x="524" y="156" font-size="18" fill="#4ade80" text-anchor="middle" font-weight="700">Hvad sker der?</text>
  <text x="524" y="196" font-size="18" fill="#e2e8f0" text-anchor="middle">tænd lyset</text>
  <text x="524" y="230" font-size="18" fill="#e2e8f0" text-anchor="middle">send en besked</text>
  <text x="524" y="264" font-size="18" fill="#e2e8f0" text-anchor="middle">sluk igen senere</text>
  <rect x="24" y="312" width="592" height="204" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="320" y="346" font-size="20" fill="#ffffff" text-anchor="middle" font-weight="700">Eksempel: lys i gangen om natten</text>
  <rect x="40" y="371" width="128" height="34" rx="6" fill="#b45309"/>
  <text x="104" y="394.3" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="700">Trigger</text>
  <text x="182" y="394.3" font-size="18" fill="#e2e8f0">bevægelse i gangen</text>
  <rect x="40" y="415" width="128" height="34" rx="6" fill="#2563eb"/>
  <text x="104" y="438.3" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="700">Betingelse</text>
  <text x="182" y="438.3" font-size="18" fill="#e2e8f0">klokken er mellem 22:00 og 07:00</text>
  <rect x="40" y="459" width="128" height="34" rx="6" fill="#15803d"/>
  <text x="104" y="482.3" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="700">Handling</text>
  <text x="182" y="482.3" font-size="18" fill="#e2e8f0">tænd lyset på 20 %, sluk efter 2 minutter</text>
</svg>
