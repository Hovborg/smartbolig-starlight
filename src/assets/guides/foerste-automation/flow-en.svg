<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 534" role="img" lang="en" font-family="system-ui, sans-serif">
  <title>An automation has three parts: trigger, condition and action</title>
  <desc>The trigger starts the automation, for example motion, sunset or a time of day. The condition decides whether it may run, for example only at night. The action is what happens, for example a light turning on. Example: when there is motion in the hallway and the time is between 22:00 and 07:00, the light turns on at 20 % and off after 2 minutes.</desc>
  <rect x="0" y="0" width="640" height="534" fill="#1a1a2e"/>
  <text x="320" y="46" font-size="26" fill="#e2e8f0" text-anchor="middle" font-weight="700">An automation has three parts</text>
  <rect x="24" y="70" width="184" height="224" rx="10" fill="#1e293b" stroke="#fbbf24" stroke-width="2"/>
  <rect x="25" y="71" width="182" height="50" rx="9" fill="#b45309"/>
  <rect x="25" y="100" width="182" height="21" fill="#b45309"/>
  <text x="116" y="103" font-size="20" fill="#ffffff" text-anchor="middle" font-weight="700">Trigger</text>
  <text x="116" y="156" font-size="18" fill="#fbbf24" text-anchor="middle" font-weight="700">When?</text>
  <text x="116" y="196" font-size="18" fill="#e2e8f0" text-anchor="middle">motion</text>
  <text x="116" y="230" font-size="18" fill="#e2e8f0" text-anchor="middle">sunset</text>
  <text x="116" y="264" font-size="18" fill="#e2e8f0" text-anchor="middle">at 07:00</text>
  <path d="M210 182L218 182" fill="none" stroke="#9ca3af" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M227 182L218 177.1L218 186.9Z" fill="#9ca3af"/>
  <rect x="228" y="70" width="184" height="224" rx="10" fill="#1e293b" stroke="#60a5fa" stroke-width="2"/>
  <rect x="229" y="71" width="182" height="50" rx="9" fill="#2563eb"/>
  <rect x="229" y="100" width="182" height="21" fill="#2563eb"/>
  <text x="320" y="103" font-size="20" fill="#ffffff" text-anchor="middle" font-weight="700">Condition</text>
  <text x="320" y="156" font-size="18" fill="#60a5fa" text-anchor="middle" font-weight="700">Only if?</text>
  <text x="320" y="196" font-size="18" fill="#e2e8f0" text-anchor="middle">only at night</text>
  <text x="320" y="230" font-size="18" fill="#e2e8f0" text-anchor="middle">someone is home</text>
  <text x="320" y="264" font-size="18" fill="#e2e8f0" text-anchor="middle">the light is off</text>
  <path d="M414 182L422 182" fill="none" stroke="#9ca3af" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M431 182L422 177.1L422 186.9Z" fill="#9ca3af"/>
  <rect x="432" y="70" width="184" height="224" rx="10" fill="#1e293b" stroke="#4ade80" stroke-width="2"/>
  <rect x="433" y="71" width="182" height="50" rx="9" fill="#15803d"/>
  <rect x="433" y="100" width="182" height="21" fill="#15803d"/>
  <text x="524" y="103" font-size="20" fill="#ffffff" text-anchor="middle" font-weight="700">Action</text>
  <text x="524" y="156" font-size="18" fill="#4ade80" text-anchor="middle" font-weight="700">What happens?</text>
  <text x="524" y="196" font-size="18" fill="#e2e8f0" text-anchor="middle">turn on a light</text>
  <text x="524" y="230" font-size="18" fill="#e2e8f0" text-anchor="middle">send a message</text>
  <text x="524" y="264" font-size="18" fill="#e2e8f0" text-anchor="middle">turn it off later</text>
  <rect x="24" y="312" width="592" height="204" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="320" y="346" font-size="20" fill="#ffffff" text-anchor="middle" font-weight="700">Example: hallway light at night</text>
  <rect x="40" y="371" width="128" height="34" rx="6" fill="#b45309"/>
  <text x="104" y="394.3" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="700">Trigger</text>
  <text x="182" y="394.3" font-size="18" fill="#e2e8f0">motion in the hallway</text>
  <rect x="40" y="415" width="128" height="34" rx="6" fill="#2563eb"/>
  <text x="104" y="438.3" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="700">Condition</text>
  <text x="182" y="438.3" font-size="18" fill="#e2e8f0">the time is between 22:00 and 07:00</text>
  <rect x="40" y="459" width="128" height="34" rx="6" fill="#15803d"/>
  <text x="104" y="482.3" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="700">Action</text>
  <text x="182" y="482.3" font-size="18" fill="#e2e8f0">light on at 20 %, off after 2 minutes</text>
</svg>
