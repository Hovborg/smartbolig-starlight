<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 888" role="img" lang="en" font-family="system-ui, sans-serif">
  <title>An automation has three parts: trigger, condition and action</title>
  <desc>The trigger starts the automation, for example motion, sunset or a time of day. The condition decides whether it may run, for example only at night. The action is what happens, for example a light turning on. Example: when there is motion in the hallway and the time is between 22:00 and 07:00, the light turns on at 20 % and off after 2 minutes.</desc>
  <rect x="0" y="0" width="640" height="888" fill="#1a1a2e"/>
  <text x="320" y="44" font-size="28" fill="#e2e8f0" text-anchor="middle" font-weight="700">An automation has three parts</text>
  <rect x="24" y="72" width="592" height="124" rx="10" fill="#1e293b" stroke="#fbbf24" stroke-width="2"/>
  <path d="M235 73H35Q25 73 25 83V185Q25 195 35 195H235Z" fill="#b45309"/>
  <text x="130" y="126" font-size="24" fill="#ffffff" text-anchor="middle" font-weight="700">Trigger</text>
  <text x="130" y="162" font-size="22" fill="#ffffff" text-anchor="middle">When?</text>
  <text x="256" y="112" font-size="22" fill="#e2e8f0">motion</text>
  <text x="256" y="146" font-size="22" fill="#e2e8f0">sunset</text>
  <text x="256" y="180" font-size="22" fill="#e2e8f0">at 07:00</text>
  <path d="M130 197L130 218" fill="none" stroke="#9ca3af" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M130 229L124 218L136 218Z" fill="#9ca3af"/>
  <rect x="24" y="230" width="592" height="124" rx="10" fill="#1e293b" stroke="#60a5fa" stroke-width="2"/>
  <path d="M235 231H35Q25 231 25 241V343Q25 353 35 353H235Z" fill="#2563eb"/>
  <text x="130" y="284" font-size="24" fill="#ffffff" text-anchor="middle" font-weight="700">Condition</text>
  <text x="130" y="320" font-size="22" fill="#ffffff" text-anchor="middle">Only if?</text>
  <text x="256" y="270" font-size="22" fill="#e2e8f0">only at night</text>
  <text x="256" y="304" font-size="22" fill="#e2e8f0">someone is home</text>
  <text x="256" y="338" font-size="22" fill="#e2e8f0">the light is off</text>
  <path d="M130 355L130 376" fill="none" stroke="#9ca3af" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M130 387L124 376L136 376Z" fill="#9ca3af"/>
  <rect x="24" y="388" width="592" height="124" rx="10" fill="#1e293b" stroke="#4ade80" stroke-width="2"/>
  <path d="M235 389H35Q25 389 25 399V501Q25 511 35 511H235Z" fill="#15803d"/>
  <text x="130" y="442" font-size="24" fill="#ffffff" text-anchor="middle" font-weight="700">Action</text>
  <text x="130" y="478" font-size="22" fill="#ffffff" text-anchor="middle">What happens?</text>
  <text x="256" y="428" font-size="22" fill="#e2e8f0">turn on a light</text>
  <text x="256" y="462" font-size="22" fill="#e2e8f0">send a message</text>
  <text x="256" y="496" font-size="22" fill="#e2e8f0">turn it off later</text>
  <rect x="24" y="538" width="592" height="326" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="320" y="580" font-size="24" fill="#ffffff" text-anchor="middle" font-weight="700">Example: hallway light at night</text>
  <rect x="40" y="610" width="176" height="44" rx="6" fill="#b45309"/>
  <text x="128" y="639.9" font-size="22" fill="#ffffff" text-anchor="middle" font-weight="700">Trigger</text>
  <text x="236" y="639.9" font-size="22" fill="#e2e8f0">motion in the hallway</text>
  <rect x="40" y="690" width="176" height="44" rx="6" fill="#2563eb"/>
  <text x="128" y="719.9" font-size="22" fill="#ffffff" text-anchor="middle" font-weight="700">Condition</text>
  <text x="236" y="704.9" font-size="22" fill="#e2e8f0">the time is between</text>
  <text x="236" y="734.9" font-size="22" fill="#e2e8f0">22:00 and 07:00</text>
  <rect x="40" y="782" width="176" height="44" rx="6" fill="#15803d"/>
  <text x="128" y="811.9" font-size="22" fill="#ffffff" text-anchor="middle" font-weight="700">Action</text>
  <text x="236" y="796.9" font-size="22" fill="#e2e8f0">light on at 20 %,</text>
  <text x="236" y="826.9" font-size="22" fill="#e2e8f0">off after 2 minutes</text>
</svg>
