name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  # The daily news workflow (ai-news.yml) publishes through this workflow, so
  # there is one deploy path with one set of gates.
  workflow_call:
    inputs:
      ref:
        description: 'Commit to check out and deploy.'
        required: true
        type: string
      quality_base:
        description: 'Commit before the change, for the changed-issue quality check.'
        required: false
        type: string
      publish:
        description: 'Deploy after the gates pass.'
        required: false
        type: boolean
        default: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # read the last successful deploy for the audit base
    # Production deploys run one at a time; pull requests only validate. A run
    # started by hand or by the dependency auto-merge only validates too. It
    # has its own group, so it can never replace a deploy that waits its turn.
    concurrency:
      group: ${{ github.event_name == 'pull_request' && format('deploy-pr-{0}', github.event.number) || (github.event_name == 'workflow_dispatch' && inputs.publish != true) && 'deploy-validate' || 'deploy-production' }}
      cancel-in-progress: false
    env:
      # The only place that decides whether a run publishes: a push to main,
      # or a call from the news workflow on main.
      SHOULD_DEPLOY: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.publish == true) }}

    steps:
      - name: Checkout
        # SHA-pinned (v6); no persisted token — this job never pushes.
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          # Empty outside workflow_call: the event's own commit is used.
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false

      # A call from the news workflow names the commit it wants deployed. When
      # main has moved on since, that commit is stale, so this run only
      # validates and publishes nothing. A newer push has its own deploy run.
      # An automatic dependency merge has none: then the issue goes out with
      # the next run that publishes (docs/opdateringer.md).
      - name: Check that the requested commit is still the tip of main
        id: tip
        if: inputs.ref != ''
        env:
          REQUESTED_REF: ${{ inputs.ref }}
        run: |
          git fetch --quiet origin main
          tip="$(git rev-parse origin/main)"
          if [ "$tip" = "$REQUESTED_REF" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "::notice::main has moved on from $REQUESTED_REF to $tip. Nothing is published by this run; the next deploy of main publishes it."
          fi

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      
      - name: Install dependencies
        run: npm ci

      - name: Install content-audit dependency
        run: python3 -m pip install --disable-pip-version-check PyYAML==6.0.3

      - name: Test site invariants
        run: npm run site:test

      - name: Test AI News automation
        run: npm run ai-news:test

      - name: Validate AI News content
        run: npm run ai-news:validate

      - name: Validate AI News image assets
        run: npm run ai-news:pending-images -- --fail-on-pending

      - name: Validate automatically published AI News quality
        env:
          QUALITY_BASE: ${{ inputs.quality_base || github.event.pull_request.base.sha || github.event.before }}
        run: npm run ai-news:quality:changed -- --base "$QUALITY_BASE"

      - name: Audit guide content
        run: python3 scripts/content-audit.py

      - name: Test content audit
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

      # The audit compares against the last commit that was deployed
      # successfully, not the previous push. A dependency change that never
      # passed the gate therefore stays gated until a run with it succeeds.
      - name: Resolve audit base
        id: audit-base
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          base="$PR_BASE"
          if [ -z "$base" ]; then
            base="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow deploy.yml --branch main --status success --limit 30 \
              --json headSha,event --jq '[.[] | select(.event != "pull_request")][0].headSha // ""' || true)"
          fi
          echo "sha=$base" >> "$GITHUB_OUTPUT"

      # Build/deploy tools execute on maintainers' machines and CI too.
      - name: Audit all dependencies
        env:
          AUDIT_BASE: ${{ steps.audit-base.outputs.sha }}
        # Gate when dependencies changed (or the range is unknown); report otherwise.
        run: npm run security:audit -- --auto --base "$AUDIT_BASE"
      
      - name: Build
        run: npm run build

      - name: Validate SEO metadata
        run: npm run seo:validate

      - name: Build Workers router
        run: npm run worker:build

      - name: Validate Workers deployment
        run: npm exec --no -- wrangler deploy --dry-run

      - name: Validate the news relay Worker
        # Validated here, deployed by hand: see workers/news-llm/README.md.
        run: npm exec --no -- wrangler deploy --dry-run --config workers/news-llm/wrangler.jsonc

      - name: Deploy to Cloudflare Workers
        if: env.SHOULD_DEPLOY == 'true' && (inputs.publish != true || steps.tip.outputs.current == 'true')
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # Wrangler is a lockfile-pinned devDependency (integrity-checked by npm
        # ci) instead of a runtime npx download next to the Cloudflare secrets.
        run: npm exec --no -- wrangler deploy

      - name: Ping IndexNow
        if: env.SHOULD_DEPLOY == 'true' && (inputs.publish != true || steps.tip.outputs.current == 'true')
        # The site is already deployed at this point — a failed search-engine
        # ping (e.g. missing key or IndexNow API hiccup) must not fail the run.
        continue-on-error: true
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: |
          node <<'NODE' > indexnow-payload.json
          const { execFileSync } = require('node:child_process');
          const key = process.env.INDEXNOW_KEY;
          if (!key) throw new Error('INDEXNOW_KEY is missing');

          const urls = new Set([
            'https://smartbolig.net/',
            'https://smartbolig.net/da/',
            'https://smartbolig.net/en/',
            'https://smartbolig.net/da/home-assistant/',
            'https://smartbolig.net/en/home-assistant/',
            'https://smartbolig.net/da/esp32/',
            'https://smartbolig.net/en/esp32/',
            'https://smartbolig.net/da/produkter/',
            'https://smartbolig.net/en/produkter/',
            'https://smartbolig.net/da/ai/',
            'https://smartbolig.net/en/ai/',
            'https://smartbolig.net/da/ai/nyheder/',
            'https://smartbolig.net/en/ai/nyheder/',
            'https://smartbolig.net/da/ai/ai-cli/',
            'https://smartbolig.net/en/ai/ai-cli/',
            'https://smartbolig.net/da/ai/ai-cli/sammenligning/',
            'https://smartbolig.net/en/ai/ai-cli/sammenligning/',
            'https://smartbolig.net/da/ai/ai-cli/priser-og-planer/',
            'https://smartbolig.net/en/ai/ai-cli/priser-og-planer/',
          ]);

          function contentFileToUrl(file) {
            if (!file.startsWith('src/content/docs/') || !file.endsWith('.mdx')) return;
            let slug = file.replace('src/content/docs/', '').replace(/\.mdx$/, '');
            if (slug.endsWith('/index')) slug = slug.slice(0, -'/index'.length);
            if (!slug) return;
            urls.add(`https://smartbolig.net/${slug}/`);
          }

          try {
            const base = execFileSync('git', ['rev-parse', 'HEAD^'], { encoding: 'utf8' }).trim();
            const changed = execFileSync('git', ['diff', '--name-only', base, 'HEAD', '--', 'src/content/docs'], { encoding: 'utf8' });
            for (const file of changed.split('\n').filter(Boolean)) contentFileToUrl(file);
          } catch {
            // Manual or first-run deploys still ping the stable section URLs above.
          }

          process.stdout.write(JSON.stringify({
            host: 'smartbolig.net',
            key,
            keyLocation: `https://smartbolig.net/${key}.txt`,
            urlList: [...urls].slice(0, 10000),
          }));
          NODE

          curl --fail-with-body -sS -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json" \
            --data-binary @indexnow-payload.json
          echo "IndexNow ping sent!"
